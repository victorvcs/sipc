<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIPC — Protótipo da jornada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f5f7; --surface:#fff; --surface-2:#f0f0f2; --line:#e2e2e6; --line-strong:#cfcfd5;
    --text:#1d1d1f; --text-dim:#5f5f66;
    --accent:#0071e3; --accent-ink:#fff; --accent-soft:#eaf3fe; --accent-deep:#0058b0;
    --seal:#1f9254; --seal-soft:#e8f7ee;
    --danger:#d23237; --danger-soft:#fdecec;
    --warn:#a86d00; --warn-soft:#fbf1de;
    --radius:16px; --radius-sm:12px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 26px rgba(29,29,31,.06);
    --shadow-up:0 -1px 0 var(--line), 0 -10px 30px rgba(29,29,31,.06);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scrollbar-color:var(--line-strong) transparent;}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;caret-color:var(--accent);}
  ::selection{background:var(--accent-soft);color:var(--accent-deep);}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:10px;border:3px solid var(--bg);}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px;}
  a{color:var(--accent);text-underline-offset:3px;}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  .dim{color:var(--text-dim);}
  .ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}

  /* faixa do protótipo */
  .faixa{background:var(--text);color:#f5f5f7;font-size:12px;text-align:center;padding:6px 12px;}
  .faixa b{font-weight:600;}

  /* botões */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:background .2s var(--ease),transform .2s var(--ease);min-height:46px;}
  .btn:hover{background:var(--accent-deep);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}
  .btn.sec{background:var(--surface);color:var(--text);border-color:var(--line);}
  .btn.sec:hover{border-color:var(--line-strong);background:var(--surface);}
  .btn.ok{background:var(--seal);} .btn.ok:hover{background:#177a45;}
  .btn.ruim{background:var(--danger);} .btn.ruim:hover{background:#b3272c;}
  .btn.link{background:none;color:var(--accent);padding:12px 8px;}
  .btn.link:hover{background:none;text-decoration:underline;}

  input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;transition:border-color .2s;}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  input::placeholder,textarea::placeholder{color:#8a8a91;}
  label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px;}

  /* ================= ASSISTENTE ================= */
  .wiz{max-width:640px;margin:0 auto;padding:28px 20px 140px;}
  .wiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
  .marca{font-family:'Fraunces',serif;font-weight:600;font-size:20px;}
  .passos{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:30px;}
  .passo{font-size:12px;color:var(--text-dim);}
  .passo i{display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:8px;transition:background .4s var(--ease);}
  .passo.feito i,.passo.atual i{background:var(--accent);}
  .passo.atual{color:var(--text);font-weight:600;}
  .wiz h1{font-size:30px;line-height:1.15;margin-bottom:10px;}
  .wiz .lead{color:var(--text-dim);margin:0 0 26px;max-width:56ch;}
  .tela{animation:entra .5s var(--ease) both;}
  @keyframes entra{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .acoes{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:var(--shadow-up);padding:14px 20px calc(14px + env(safe-area-inset-bottom));z-index:20;}
  .acoes-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;}

  .escolha{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .opcao{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,box-shadow .2s;}
  .opcao:hover{border-color:var(--line-strong);}
  .opcao.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .opcao .ico{width:24px;height:24px;color:var(--accent);margin-bottom:4px;}
  .opcao b{font-size:15px;} .opcao span{font-size:13px;color:var(--text-dim);}

  .soltar{border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:30px 20px;text-align:center;}
  .soltar p{margin:6px 0 14px;color:var(--text-dim);font-size:14px;}
  .soltar > .ico{width:28px;height:28px;color:var(--accent);}
  .soltar.sobre{border-color:var(--accent);background:var(--accent-soft);}
  .formatos{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 16px;}
  .formatos span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);background:var(--surface-2);border-radius:999px;padding:5px 12px;}
  .formatos .ico{width:16px;height:16px;}
  .arqs{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;}
  .arq{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;}
  .arq .ico{color:var(--accent);}
  .arq-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  .arq-tipo{font-size:12px;color:var(--text-dim);}
  .arq-x{border:none;background:none;color:var(--text-dim);cursor:pointer;padding:4px;border-radius:8px;display:grid;}
  .arq-x:hover{color:var(--danger);background:var(--danger-soft);}
  .arq-x .ico{width:16px;height:16px;}
  .exemplo{font-size:13px;color:var(--text-dim);margin:12px 0 0;}

  .leitura{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .leitura ol{list-style:none;margin:0;padding:0;}
  .leitura li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-size:14px;color:var(--text-dim);opacity:.35;transition:opacity .4s var(--ease);}
  .leitura li.on{opacity:1;color:var(--text);}
  .leitura li .ico{width:18px;height:18px;margin-top:2px;color:var(--seal);}
  .achado{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--seal-soft);color:#155f37;font-size:14px;}
  .achado b{font-size:16px;}
  .erro{margin-top:16px;padding:14px 16px;border-radius:var(--radius-sm);background:var(--danger-soft);color:#9e2428;font-size:14px;}
  .aviso{padding:14px 16px;border-radius:var(--radius-sm);background:var(--warn-soft);color:#6e4800;font-size:14px;}

  /* revisar matérias */
  .materia{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .materia-cab{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;}
  .materia-cab b{font-weight:600;}
  .materia-cab .meta{font-size:12px;color:var(--text-dim);}
  .peso{display:flex;align-items:center;gap:10px;}
  .peso-barra{width:110px;height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;}
  .peso-barra i{display:block;height:100%;background:var(--accent);border-radius:8px;}
  .peso .num{font-size:13px;min-width:44px;text-align:right;}
  .chev{color:var(--text-dim);transition:transform .3s var(--ease);}
  .materia.aberta .chev{transform:rotate(90deg);}
  .topicos{display:none;border-top:1px solid var(--line);padding:6px 16px 12px;}
  .materia.aberta .topicos{display:block;}
  .topicos li{font-size:14px;padding:5px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;}
  .topicos ul{margin:0;padding:0;}
  .mini{font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;}
  .materia.nova{padding:16px;}
  .total{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);padding:6px 4px 0;}

  /* banca */
  .busca{position:relative;margin-bottom:14px;}
  .busca .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);width:18px;height:18px;}
  .busca input{padding-left:42px;}
  .bancas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;}
  .chip:hover{border-color:var(--line-strong);}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:600;}
  .chip small{font-size:11px;color:var(--seal);font-weight:600;margin-left:6px;}
  .ficha{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .ficha dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px;}
  .ficha dt{color:var(--text-dim);} .ficha dd{margin:0;font-weight:500;}

  /* ritmo */
  .campo{margin-bottom:22px;}
  .horas{display:flex;align-items:center;gap:16px;}
  .horas input[type=range]{flex:1;accent-color:var(--accent);}
  .horas .num{font-size:20px;font-weight:700;min-width:84px;text-align:right;}
  .dias{display:flex;gap:6px;flex-wrap:wrap;}
  .dia{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;}
  .dia.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .previsao{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .previsao p{margin:0 0 14px;font-size:15px;}
  .linha-tempo{display:flex;height:14px;border-radius:14px;overflow:hidden;background:var(--surface-2);margin-bottom:8px;}
  .linha-tempo .a{background:var(--accent);} .linha-tempo .b{background:var(--seal);} .linha-tempo .c{background:var(--danger);}
  .legenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--text-dim);}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .sugestoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  .resumo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 18px;margin-bottom:18px;}
  .resumo div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .resumo div:last-child{border:none;}
  .resumo span{color:var(--text-dim);}
  .resumo b{text-align:right;font-weight:600;}
  .conta{display:grid;gap:10px;}

  /* ================= APP ================= */
  .app{max-width:1080px;margin:0 auto;padding:22px 20px 100px;}
  .topo{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .topo h1{font-size:22px;}
  .topo .sub{font-size:13px;color:var(--text-dim);}
  .contagem{text-align:right;font-size:13px;color:var(--text-dim);}
  .contagem .num{display:block;font-size:22px;font-weight:700;color:var(--accent);}
  .abas{display:flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none;}
  .aba{border:none;background:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--text-dim);cursor:pointer;white-space:nowrap;}
  .aba.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(29,29,31,.1);}

  .hoje{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;}
  .dia-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px;}
  .dia-cab h2{font-size:24px;}
  .dia-cab .sub{font-size:14px;color:var(--text-dim);}
  .barra-dia{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:18px;}
  .barra-dia i{display:block;height:100%;background:var(--seal);border-radius:6px;transition:width .6s var(--ease);}
  .nota{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-sm);background:var(--accent-soft);color:#08407e;font-size:14px;margin-bottom:16px;}
  .nota .ico{color:var(--accent);margin-top:1px;}

  .plano{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .grupo{font-size:12px;font-weight:600;color:var(--text-dim);padding:14px 18px 6px;background:var(--surface);}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s;}
  .grupo + .item{border-top:none;}
  .item:hover{background:#fafafc;}
  .marca-check{width:26px;height:26px;border-radius:50%;border:1.75px solid var(--line-strong);display:grid;place-items:center;background:var(--surface);}
  .marca-check .ico{width:15px;height:15px;stroke-width:2.4;color:#fff;opacity:0;}
  .item.feito .marca-check{background:var(--seal);border-color:var(--seal);}
  .item.feito .marca-check .ico{opacity:1;}
  .item.feito .tit{color:var(--text-dim);text-decoration:line-through;text-decoration-color:var(--line-strong);}
  .tit{font-weight:600;font-size:15px;}
  .meta-item{font-size:13px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;}
  .tag.rev{background:var(--warn-soft);color:var(--warn);}
  .tag.est{background:var(--accent-soft);color:var(--accent-deep);}
  .tag.q{background:var(--seal-soft);color:#177a45;}
  .tempo{font-size:13px;color:var(--text-dim);white-space:nowrap;}

  .lado{display:grid;gap:14px;}
  .bloco{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .bloco h3{font-size:16px;margin-bottom:12px;}
  .semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--text-dim);}
  .semana i{display:block;width:30px;height:30px;margin:6px auto 0;border-radius:50%;border:1.5px solid var(--line);}
  .semana .s i{background:var(--seal);border-color:var(--seal);}
  .semana .x i{border-style:dashed;}
  .semana .h i{border-color:var(--accent);border-width:2px;}
  .cobertura div{display:grid;grid-template-columns:1fr 70px 34px;gap:10px;align-items:center;font-size:13px;padding:4px 0;}
  .cobertura .peso-barra{width:auto;}

  /* estudo */
  .leitor{max-width:720px;margin:0 auto;}
  .voltar{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:12px;}
  .voltar:hover{color:var(--text);}
  .voltar .ico{width:18px;height:18px;}
  .leitor h1{font-size:30px;margin-bottom:6px;}
  .leitor .sub{color:var(--text-dim);font-size:14px;margin-bottom:24px;}
  .secao{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:12px;}
  .secao h2{font-size:18px;margin-bottom:8px;color:var(--accent-deep);}
  .secao p{margin:0 0 8px;max-width:68ch;}
  .secao table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;}
  .secao th,.secao td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .secao th{font-size:12px;color:var(--text-dim);font-weight:600;}
  .arvore,.arvore ul{list-style:none;margin:0;padding:0;}
  .arvore ul{padding-left:20px;}
  .arvore li{position:relative;padding:4px 0 4px 16px;font-size:14px;}
  .arvore ul li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--line-strong);}
  .arvore ul li::after{content:"";position:absolute;left:0;top:15px;width:11px;border-top:1px solid var(--line-strong);}
  .arvore ul li:last-child::before{bottom:auto;height:15px;}
  .arvore > li{padding-left:0;font-weight:700;color:var(--accent-deep);}
  .arvore > li li{font-weight:500;color:var(--text);}
  .partes{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .partes button{width:100%;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .partes .pn{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;flex:none;}
  .partes .pn .ico{width:13px;height:13px;stroke-width:2.4;}
  .partes button.feita{color:var(--seal);} .partes button.feita .pn{background:var(--seal);color:#fff;}
  .partes button.on{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft);}
  .partes button.on .pn{background:var(--accent);color:#fff;}
  .lista{margin:0;padding-left:20px;} .lista li{margin-bottom:6px;max-width:68ch;}
  .escada{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .escada span{font-size:12px;font-family:'JetBrains Mono',monospace;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--text-dim);}
  .escada span.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .secao h3{font-size:15px;margin:16px 0 6px;color:var(--text);}
  .secao h3:first-child{margin-top:4px;}
  .r1{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px;}
  .r1 dt{font-weight:600;} .r1 dd{margin:0;color:var(--text-dim);}
  .q-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
  .q-cab{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:8px;}
  .res{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13px;border-radius:999px;padding:2px 10px;}
  .res .ico{width:14px;height:14px;stroke-width:2.4;}
  .res.ok{background:var(--seal-soft);color:#177a45;} .res.nao{background:var(--danger-soft);color:var(--danger);} .res.nada{background:var(--surface-2);color:var(--text-dim);}
  .gab{margin:0;padding-left:22px;font-size:14px;} .gab li{margin-bottom:8px;} .gab li.nao{color:#8f2024;} .gab li.ok::marker{color:var(--seal);}
  .check{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
  .check li{display:flex;gap:10px;align-items:flex-start;font-size:15px;} .check .ico{color:var(--seal);margin-top:2px;width:18px;height:18px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .card-f{min-height:110px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:14px;cursor:pointer;font-size:15px;}
  .card-f:hover{border-color:var(--line-strong);}
  .card-f.virado{border-color:var(--accent);background:var(--accent-soft);}
  .lado-q{font-weight:600;} .lado-a{color:var(--accent-deep);} .toque{font-size:12px;color:var(--text-dim);}
  .qtd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .qtd .chip{min-width:52px;text-align:center;}
  .qtd-outra{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-dim);border:1.5px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;}
  .qtd-outra.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);}
  .qtd-outra input{width:64px;padding:5px 8px;border-radius:999px;}
  .fim-estudo{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}

  /* questões */
  .quiz{max-width:720px;margin:0 auto;}
  .quiz-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;}
  .pontos{display:flex;gap:5px;}
  .pontos i{width:22px;height:5px;border-radius:5px;background:var(--line);}
  .pontos i.c{background:var(--seal);} .pontos i.e{background:var(--danger);} .pontos i.a{background:var(--accent);}
  .questao{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;}
  .origem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;margin-bottom:14px;}
  .origem.real{background:#1d1d1f;color:#fff;}
  .origem.ined{background:var(--surface-2);color:var(--text-dim);}
  .origem .ico{width:14px;height:14px;}
  .texto-base{margin:0 0 14px;padding:14px 16px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:15px;line-height:1.65;font-family:Georgia,"Fraunces",serif;max-width:68ch;}
  .enunciado{font-size:16px;line-height:1.6;margin:0 0 14px;max-width:68ch;}
  .enunciado:last-of-type{margin-bottom:18px;}
  .alts{display:grid;gap:8px;}
  .alt{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface);cursor:pointer;font-size:15px;transition:border-color .2s,background .2s;}
  .alt:hover{border-color:var(--line-strong);}
  .alt .letra{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:13px;}
  .alt.sel{border-color:var(--accent);background:var(--accent-soft);}
  .alt.sel .letra{background:var(--accent);color:#fff;}
  .alt.certa{border-color:var(--seal);background:var(--seal-soft);}
  .alt.certa .letra{background:var(--seal);color:#fff;}
  .alt.errada{border-color:var(--danger);background:var(--danger-soft);}
  .alt.errada .letra{background:var(--danger);color:#fff;}
  .alt:disabled{cursor:default;}
  .alt .ico{width:18px;height:18px;}
  .gabarito{margin-top:16px;padding:16px;border-radius:var(--radius-sm);font-size:14px;animation:entra .4s var(--ease) both;}
  .gabarito.ok{background:var(--seal-soft);color:#155f37;}
  .gabarito.nao{background:var(--danger-soft);color:#8f2024;}
  .gabarito b{display:block;font-size:15px;margin-bottom:4px;}
  .gabarito p{margin:0;color:var(--text);}
  .gabarito .fonte{margin-top:8px;font-size:12px;}
  .quiz-acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .placar{text-align:center;padding:30px 20px;}
  .placar .num{font-size:56px;font-weight:700;color:var(--text);display:block;line-height:1;margin:10px 0;}
  .placar ul{list-style:none;padding:0;margin:20px auto;max-width:420px;text-align:left;}
  .placar li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}

  /* revisão */
  .cartao{max-width:560px;margin:0 auto;}
  .frente{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;text-align:center;}
  .frente .pergunta{font-family:'Fraunces',serif;font-size:21px;line-height:1.35;margin:10px 0 22px;text-wrap:balance;}
  .verso{border-top:1px solid var(--line);margin-top:18px;padding-top:18px;font-size:15px;text-align:left;animation:entra .4s var(--ease) both;}
  .notas3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .notas3 button{display:flex;flex-direction:column;gap:2px;padding:12px 8px;}
  .notas3 small{font-weight:500;opacity:.85;font-size:12px;}

  .vazio{text-align:center;padding:40px 20px;color:var(--text-dim);}

  /* trilha */
  .trilha-dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;display:grid;grid-template-columns:110px 1fr;gap:14px;}
  .trilha-dia .d{font-weight:600;font-size:14px;}
  .trilha-dia .d span{display:block;font-size:12px;color:var(--text-dim);font-weight:400;}
  .trilha-dia ul{margin:0;padding:0;list-style:none;font-size:14px;}
  .trilha-dia li{padding:2px 0;}

  /* painel do protótipo */
  .painel{position:fixed;left:16px;bottom:16px;z-index:50;font-size:13px;}
  .painel-btn{display:flex;align-items:center;gap:6px;background:var(--text);color:#fff;border:none;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .painel-corpo{display:none;position:absolute;left:0;bottom:42px;width:300px;max-height:70vh;overflow:auto;background:var(--text);color:#e9e9ee;border-radius:var(--radius);padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .painel.aberto .painel-corpo{display:block;}
  .painel h4{margin:12px 0 8px;font-size:12px;color:#a1a1aa;font-weight:600;}
  .painel h4:first-child{margin-top:0;}
  .painel-grade{display:flex;flex-wrap:wrap;gap:6px;}
  .painel-grade button{background:#2c2c30;color:#f5f5f7;border:1px solid #3a3a40;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;}
  .painel-grade button:hover{background:#3a3a40;}
  .painel-grade button.on{background:var(--accent);border-color:var(--accent);}
  .painel p{margin:10px 0 0;color:#a1a1aa;font-size:12px;line-height:1.5;}


  /* mapa visual animado */
  .mapa-anim{margin:6px 0 14px;}
  .mapa-radial{width:100%;height:auto;display:block;overflow:visible;}
  .m-lig{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;animation:desenha .7s var(--ease) forwards;}
  .m-fina{stroke-width:1.5;opacity:.4;}
  .m-centro rect{fill:var(--accent-deep);} .m-centro text{fill:#fff;font:700 18px Inter,sans-serif;}
  .m-centro{animation:surge .5s var(--ease) both;transform-box:fill-box;transform-origin:center;}
  .m-ramo rect{fill:var(--accent);} .m-ramo text{fill:#fff;font:600 15px Inter,sans-serif;pointer-events:none;}
  .m-ramo{cursor:pointer;opacity:0;animation:surge .45s var(--ease) forwards;transform-box:fill-box;transform-origin:center;outline:none;}
  .m-ramo:hover rect,.m-ramo:focus-visible rect{fill:var(--accent-deep);}
  .m-folha rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2;} .m-folha text{fill:var(--text);font:500 13px Inter,sans-serif;}
  .m-folha{opacity:0;animation:surge .4s var(--ease) forwards;transform-box:fill-box;transform-origin:center;}
  .apagado{opacity:.12 !important;animation:none;stroke-dashoffset:0;}
  .m-ramo.apagado,.m-folha.apagado{opacity:.15 !important;}
  @keyframes desenha{to{stroke-dashoffset:0;}}
  @keyframes surge{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:none;}}
  .mapa-anim.repetir .m-lig{animation:none;stroke-dashoffset:1;}
  .mapa-anim.repetir .m-lig{animation:desenha .7s var(--ease) forwards;}
  .estatico .m-lig{animation:none;stroke-dashoffset:0;} .estatico .m-ramo,.estatico .m-folha,.estatico .m-centro{animation:none;opacity:1;}
  .mapa-lista{display:none;list-style:none;margin:0;padding:0;}
  .mapa-lista ul{list-style:none;margin:0;padding-left:18px;border-left:2px solid var(--accent-soft);}
  .mapa-lista li{animation:entra .45s var(--ease) both;margin:6px 0;}
  .mapa-lista li > span{display:inline-block;border-radius:999px;padding:5px 12px;font-size:14px;}
  .mapa-lista .n0 > span{background:var(--accent-deep);color:#fff;font-weight:700;}
  .mapa-lista .n1 > span{background:var(--accent);color:#fff;font-weight:600;}
  .mapa-lista .n2 > span{background:var(--surface);border:1px solid var(--line-strong);}
  @media (max-width:700px){ .mapa-radial{display:none;} .mapa-lista{display:block;} }
  @media (prefers-reduced-motion:reduce){ .m-lig{stroke-dashoffset:0;} .m-ramo,.m-folha{opacity:1;} }

  /* continuar de onde parou */
  .item.meio .marca-check{border-color:var(--accent);background:linear-gradient(90deg, var(--accent) 50%, var(--surface) 50%);}
  .parou{font-size:12px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);border-radius:999px;padding:1px 8px;}
  .continuar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;}
  .continuar div{display:grid;font-size:14px;} .continuar span{color:#08407e;font-size:13px;}
  .retomada{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--accent-soft);color:#08407e;border-radius:var(--radius-sm);padding:10px 12px;margin:-6px 0 14px;}
  .retomada .ico{width:18px;height:18px;}
  .parar{display:block;margin:-10px 0 12px auto;padding:4px 0;font-size:13px;}

  /* vídeos */
  .video{position:relative;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:#000;margin-bottom:10px;}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .video-capa{position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:#000;}
  .video-capa img{width:100%;height:100%;object-fit:cover;opacity:.92;transition:opacity .2s;}
  .video-capa:hover img{opacity:1;}
  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;color:#fff;}
  .play .ico{width:30px;height:30px;margin-left:4px;}
  .video-info{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;}
  .video-info div,.videos li > div{display:grid;font-size:14px;gap:2px;} .video-info .dim,.videos .dim{font-size:12px;}
  .videos{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
  .videos li{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .videos li:last-child{border-bottom:none;}
  .videos a{color:var(--text);text-decoration:none;} .videos a:hover b{color:var(--accent-deep);text-decoration:underline;}
  .v-thumb img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;}
  .v-dados{font-size:12px;color:var(--text-dim);}
  .v-dados b{color:var(--text);font-weight:600;}
  .v-porque{font-size:12px;color:#08407e;background:var(--accent-soft);border-radius:8px;padding:4px 8px;margin-top:4px;justify-self:start;}
  .v-thumb{position:relative;}
  .v-dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:600;border-radius:4px;padding:1px 5px;}
  .opcionais{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
  .opcionais summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--text-dim);padding:4px 0;}
  .opcionais summary:hover{color:var(--text);}
  .assistido{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .assistido .ico{width:15px;height:15px;stroke-width:2.4;}
  .assistido.on{background:var(--seal-soft);border-color:var(--seal-soft);color:#177a45;}
  @media (max-width:600px){ .videos li{grid-template-columns:88px 1fr;} .videos li .assistido{grid-column:1 / -1;justify-self:start;} .v-thumb img{width:88px;} .video-info{flex-direction:column;align-items:flex-start;} }

  /* rascunho */
  .rasc{margin-top:12px;}
  .rasc-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-strong);background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .rasc-btn .ico{width:15px;height:15px;}
  .rasc-btn.on,.rasc-btn:hover{border-style:solid;border-color:var(--accent);color:var(--accent-deep);}
  .rasc-salvo{font-size:11px;background:var(--seal-soft);color:#177a45;border-radius:999px;padding:1px 7px;}
  .rasc-painel{margin-top:8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fffef8;overflow:hidden;}
  .rasc-abas{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-bottom:1px solid var(--line);background:var(--surface);}
  .rasc-abas button{border:none;background:none;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;}
  .rasc-abas button.on{background:var(--accent-soft);color:var(--accent-deep);}
  .rasc-ferr{margin-left:auto;display:flex;gap:2px;}
  .rasc-texto{border:none;border-radius:0;background:transparent;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.7;resize:vertical;min-height:120px;}
  .rasc-texto:focus{box-shadow:none;}
  .rasc-tela{display:block;width:100%;aspect-ratio:1200/420;touch-action:none;cursor:crosshair;
    background-image:linear-gradient(var(--line) 1px, transparent 1px),linear-gradient(90deg, var(--line) 1px, transparent 1px);background-size:24px 24px;}

  /* revisão 1-7-30 */
  .alerta{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .alerta-cab{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:15px;}
  .alerta-cab .ico{color:var(--accent);}
  .alerta p{margin:4px 0 0;font-size:14px;line-height:1.6;}
  .escada span.feita{background:var(--seal-soft);border-color:var(--seal-soft);color:#177a45;}
  .trilha-rev{margin:8px 0 0;font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .trilha-rev .tag{font-size:11px;padding:1px 7px;}
  .lembrete{position:fixed;top:44px;right:16px;z-index:90;max-width:360px;background:var(--text);color:#fff;border-radius:14px;padding:12px 16px;display:grid;gap:4px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.3);transform:translateY(-12px);opacity:0;pointer-events:none;transition:all .3s var(--ease);}
  .lembrete.on{opacity:1;transform:none;}

  /* Cebraspe */
  .ce-base{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:18px 0 10px;}
  .alts-ce{grid-template-columns:1fr 1fr;}

  /* revisões montadas */
  .rev-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;}
  .rev-grid > div{display:grid;gap:16px;}
  .sub-h{font-family:Inter,sans-serif;font-size:14px;font-weight:700;margin:16px 0 8px;}
  .escolha3{grid-template-columns:repeat(3,1fr);}
  .escolha3 .opcao{padding:12px;} .escolha3 .opcao b{font-size:14px;}
  .opcao:disabled{opacity:.5;cursor:not-allowed;}
  .chip:disabled{opacity:.45;cursor:not-allowed;}
  .kpis3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:860px){ .rev-grid{grid-template-columns:1fr;} .escolha3{grid-template-columns:1fr;} .kpis3{grid-template-columns:1fr;} }

  /* modo teste */
  .mt-chave{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;margin-bottom:6px;}
  .mt-chave input{position:absolute;opacity:0;width:0;height:0;}
  .mt-trilho{width:34px;height:20px;border-radius:20px;background:var(--line-strong);position:relative;transition:background .2s;}
  .mt-trilho::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);}
  .mt-chave.on{color:var(--warn);} .mt-chave.on .mt-trilho{background:var(--warn);} .mt-chave.on .mt-trilho::after{transform:translateX(14px);}
  .mt-chave input:focus-visible + .mt-trilho{outline:2px solid var(--accent);outline-offset:2px;}
  .contagem .mt-chave{display:flex;justify-content:flex-end;}
  .mt-faixa{background:var(--warn-soft);color:#6e4800;font-size:13px;text-align:center;padding:8px 12px;border-bottom:1px solid #ecd9b0;}
  .mt-faixa button{border:none;background:none;color:#6e4800;font-weight:700;text-decoration:underline;cursor:pointer;font-size:13px;}

  /* minhas trilhas */
  .trocar-trilha{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--accent-deep);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:4px;}
  .trocar-trilha .ico{width:16px;height:16px;}
  .trocar-trilha:hover{text-decoration:underline;}
  .trilhas-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .trilha-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .trilha-card.atual{border-color:var(--accent);}
  .tc-topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px;}
  .tc-topo h2{font-size:20px;margin-bottom:2px;} .tc-topo .dim{font-size:13px;}
  .tc-dados{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--text-dim);margin-top:8px;}
  .tc-dados b{color:var(--text);}
  .tc-parou{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--accent-soft);color:#08407e;border-radius:10px;padding:8px 10px;margin:12px 0 0;}
  .tc-parou .ico{width:16px;height:16px;}
  .trilha-nova{display:grid;place-items:center;align-content:center;gap:4px;min-height:200px;border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:none;cursor:pointer;font-size:15px;color:var(--text);}
  .trilha-nova span:first-child{font-size:30px;color:var(--accent);line-height:1;}
  .trilha-nova:hover{border-color:var(--accent);background:var(--accent-soft);}

  /* conta */
  .conta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start;}
  .conta-grid .lembretes{grid-row:span 2;}
  .lm-op{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
  .lm-op div{display:grid;gap:2px;font-size:14px;} .lm-op .dim{font-size:13px;}
  .lm-op .btn{flex:none;}
  .ruim-txt{color:var(--danger);}
  input[type=time]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;}
  @media (max-width:860px){ .conta-grid{grid-template-columns:1fr;} .conta-grid .lembretes{grid-row:auto;} .lm-op{flex-direction:column;align-items:flex-start;} }

  /* painel */
  .painel-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;}
  .p-abre{grid-column:1 / -1;}
  .p-abre h2{font-size:26px;margin:8px 0 6px;}
  .p-abre > p{margin:0 0 10px;max-width:70ch;}
  .p-status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px 3px 8px;}
  .p-status .ico{width:15px;height:15px;stroke-width:2.4;}
  .p-status.ok{background:var(--seal-soft);color:#177a45;}
  .grafico{width:100%;height:auto;display:block;overflow:visible;}
  .g-grade{stroke:var(--line);stroke-width:1;}
  .g-eixo{font:12px Inter,sans-serif;fill:var(--text-dim);font-variant-numeric:tabular-nums;}
  .g-real{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .g-plano{fill:none;stroke:#8e8e93;stroke-width:2;stroke-dasharray:5 5;}
  .g-ponto{fill:var(--accent);stroke:var(--surface);stroke-width:2;}
  .g-rot{font:600 12px Inter,sans-serif;fill:var(--text-dim);}

  @media (max-width:600px){

<script>
/* ------------------------------------------------------------------
   Protótipo navegável da jornada do SIPC. Tudo aqui é fictício e fica
   só na memória: nenhuma IA, nenhum Firebase. Serve para avaliar a
   sequência de telas, os estados e o texto antes de mexer no app.
------------------------------------------------------------------- */
const HOJE = new Date('2026-10-23T12:00:00'); // sexta-feira fictícia
const ico = (n, c='') => `<svg class="ico ${c}" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
const fmtData = (d, o) => d.toLocaleDateString('pt-BR', o);

const MATERIAS_BASE = [
  {nome:'Direito Administrativo', peso:30, topicos:['Atos administrativos','Poderes da administração','Licitações (Lei 14.133/2021)','Contratos administrativos','Lei 8.112/1990','Processo administrativo (Lei 9.784/1999)','Improbidade administrativa']},
  {nome:'Administração Pública', peso:20, topicos:['Planejamento estratégico','Gestão de pessoas','Gestão de processos','Atendimento ao público','Governança pública']},
  {nome:'Língua Portuguesa', peso:15, topicos:['Interpretação de textos','Ortografia','Crase','Concordância verbal e nominal','Regência','Pontuação','Classes de palavras']},
  {nome:'Direito Constitucional', peso:15, topicos:['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado','Administração pública na Constituição','Poder Judiciário']},
  {nome:'Raciocínio Lógico', peso:10, topicos:['Proposições e conectivos','Equivalências e negações','Diagramas lógicos','Contagem e probabilidade']},
  {nome:'Noções de Informática', peso:10, topicos:['Windows e pacote Office','Internet e correio eletrônico','Segurança da informação']}
];

const BANCAS = [
  {n:'FGV', f:'Múltipla escolha, A a E'}, {n:'Cebraspe', f:'Certo ou Errado'}, {n:'FCC', f:'Múltipla escolha, A a E'},
  {n:'Vunesp', f:'Múltipla escolha, A a E'}, {n:'Cesgranrio', f:'Múltipla escolha, A a E'}, {n:'IBFC', f:'Múltipla escolha'},
  {n:'Instituto AOCP', f:'Múltipla escolha, A a E'}, {n:'Quadrix', f:'Múltipla escolha ou Certo/Errado'}, {n:'IDECAN', f:'Múltipla escolha'},
  {n:'Consulplan', f:'Múltipla escolha'}, {n:'Fundatec', f:'Múltipla escolha'}, {n:'IADES', f:'Múltipla escolha'}
];

/* Questões no padrão FGV: situação concreta (servidor, órgão, problema),
   texto-base quando a matéria pede, afirmativas para julgar e alternativas
   que trazem a justificativa. No enunciado, parágrafos são separados por uma
   linha em branco; parágrafo começando com ">" é texto-base (citação). */
const QUESTOES = [
  {real:true, fonte:'FGV · 2024 · Prefeitura de Exemplo — Analista', topico:'Licitações (Lei 14.133/2021)',
   enun:'A Secretaria Municipal de Saúde de um município precisa adquirir, ao longo do próximo ano, materiais de escritório e de limpeza cujos padrões de desempenho e qualidade podem ser objetivamente definidos no edital, por meio de especificações usuais de mercado. Preocupado em obter o melhor preço, o secretário consultou a assessoria jurídica sobre a modalidade de licitação a ser adotada.\n\nÀ luz da Lei nº 14.133/2021, a assessoria jurídica deve orientar que a modalidade adequada é o(a):',
   alts:['concorrência, pois o valor estimado da contratação é elevado e exige ampla publicidade','pregão, por se tratar de bens comuns, com julgamento pelo menor preço ou pelo maior desconto','concurso, porque a Administração precisa escolher o material de melhor qualidade técnica','leilão, porque vence o fornecedor que oferecer o menor lance','diálogo competitivo, porque a Administração precisa discutir soluções com os fornecedores'], c:1,
   just:'Bens e serviços comuns, cujos padrões podem ser definidos por especificações usuais de mercado, são licitados obrigatoriamente por pregão, com critério de menor preço ou maior desconto.'},
  {real:false, topico:'Crase',
   enun:'Leia o comunicado interno elaborado por um servidor do tribunal:\n\n>Informamos a todos os servidores que, a partir de segunda-feira, o atendimento ao público será feito das 9h às 17h. Pedimos atenção àquelas unidades que ainda não enviaram a escala de plantão, que deve ser encaminhada à Diretoria-Geral até sexta-feira. Agradecemos a colaboração de todos.\n\nEm relação ao emprego do acento indicativo de crase no comunicado, assinale a afirmativa correta.',
   alts:['Em "às 17h", o acento é facultativo, por se tratar de indicação de horário.','Em "àquelas unidades", o acento se justifica pela fusão da preposição exigida por "atenção" com o pronome demonstrativo.','Em "à Diretoria-Geral", o acento é indevido, pois o verbo "encaminhar" não exige preposição.','Em "a todos os servidores", deveria haver acento grave, pois o verbo "informar" exige preposição.','Em "a colaboração", deveria haver acento grave, pois o verbo "agradecer" exige preposição.'], c:1,

/* ------------------------- cálculo do ritmo ------------------------- */
function ritmo(){
  const totalTop = S.materias.reduce((a,m)=>a+m.topicos.length,0);
  const min = S.horas*60;
  // 70% do tempo para tópicos novos; cada um leva uns 40 min (leitura, vídeos
  // essenciais e questões). O resto do dia vai para as revisões 1-7-30.
  const topDia = Math.max(1, Math.round(min*0.7/40));
  const diasSemana = S.dias.filter(Boolean).length || 1;
  const diasEstudo = Math.ceil(totalTop/topDia);
  const diasCorridos = Math.ceil(diasEstudo*7/diasSemana);
  const ateProva = Math.max(0, Math.round((new Date(S.dataProva+'T12:00:00') - HOJE)/86400000));
  return {totalTop, topDia, diasEstudo, diasCorridos, ateProva, folga: ateProva - diasCorridos};
}

const NOMES_PASSO = ['Edital','Matérias','Banca','Ritmo','Pronto'];

function telaAssist(){
  const p = S.passo;
  const barra = NOMES_PASSO.map((n,i)=>`<div class="passo ${i+1<p?'feito':''} ${i+1===p?'atual':''}"><i></i>${n}</div>`).join('');
  let corpo = '', podeSeguir = true, rotuloSeguir = 'Continuar';
  if(p===1){ corpo = passoEdital(); podeSeguir = S.edStatus==='pronto'; }
  if(p===2){ corpo = passoMaterias(); }
  if(p===3){ corpo = passoBanca(); podeSeguir = S.bancas.length>0; }
  if(p===4){ corpo = passoRitmo(); }
  if(p===5){ corpo = passoPronto(); rotuloSeguir = 'Começar hoje'; }
  return `<div class="wiz">
    <div class="wiz-top"><span class="marca">SIPC</span><span class="dim" style="font-size:13px;display:flex;align-items:center;gap:12px">${chaveTeste()}${S.conta ? `Olá, ${escHtml(S.conta.nome)} · ` : ""}Configuração · cerca de 3 min</span></div>

/* Tipos de arquivo aceitos no passo 1. No app real: PDF pelo pdf.js (ou
   direto no Gemini), planilha pelo SheetJS, Word pelo mammoth.js — tudo no
   navegador, sem servidor. */
const TIPOS = {
  pdf:      {rot:'PDF',      ico:'doc',   ext:['pdf'],                  abrir:'84 páginas', achar:'Encontrando o conteúdo programático (Anexo II)'},
  planilha: {rot:'Planilha', ico:'sheet', ext:['xlsx','xls','csv','ods'], abrir:'2 abas',     achar:'Lendo as colunas Matéria, Peso e Assunto'},
  doc:      {rot:'Word',     ico:'doc',   ext:['docx','doc','odt','txt','rtf'], abrir:'12 páginas', achar:'Encontrando a lista de matérias no texto'}
};
const ACEITOS = Object.values(TIPOS).flatMap(t=>t.ext.map(e=>'.'+e)).join(',');
function tipoDe(nome){
  const ext = (nome.split('.').pop()||'').toLowerCase();
  return Object.keys(TIPOS).find(k=>TIPOS[k].ext.includes(ext)) || null;
}
function passosLeitura(){
  if(S.edModo==='texto') return ['Lendo o texto colado','Separando matérias e pesos','Organizando os tópicos de cada matéria'];
  const p = [];
  if(S.arquivos.length>1) p.push(`Juntando ${S.arquivos.length} arquivos`);
  S.arquivos.forEach(a=>{ const t=TIPOS[a.tipo]; p.push(`Abrindo ${a.nome} (${t.abrir})`); p.push(t.achar); });
  p.push('Separando matérias e pesos','Organizando os tópicos de cada matéria');
  return p;
}
function addArquivos(lista){
  const recusados = [];
  [...lista].forEach(f=>{
    const tipo = tipoDe(f.name);
    if(!tipo){ recusados.push(f.name); return; }
    if(!S.arquivos.some(a=>a.nome===f.name)) S.arquivos.push({nome:f.name, tipo, file: f instanceof Blob ? f : null});
  });
  S.recusados = recusados;
  render(true);
}
function arquivoExemplo(tipo){
  const nomes = {pdf:'edital.pdf', planilha:'materias-e-pesos.xlsx', doc:'conteudo-programatico.docx'};
  if(!S.arquivos.some(a=>a.nome===nomes[tipo])) S.arquivos.push({nome:nomes[tipo], tipo, file:null});
  S.recusados = [];
  render(true);
}
function removerArquivo(i){ S.arquivos.splice(i,1); render(true); }

function passoEdital(){

  if(S.edStatus==='lendo' || S.edStatus==='pronto' || S.edStatus==='erro'){

    estado = `<div class="leitura" aria-live="polite"><ol>${passos.map((t,i)=>`<li class="${i<S.edPasso?'on':''}">${ico('check')}<span>${t}</span></li>`).join('')}</ol>
      ${S.edStatus==='pronto' ? `<div class="achado"><b>Achei ${S.materias.length} matérias e ${S.materias.reduce((a,m)=>a+m.topicos.length,0)} tópicos ${fontes}.</b><br>${S.prova.fonte==='exemplo' ? 'Matérias de exemplo: a banca e a data você define nos próximos passos.' : escHtml(S.prova.nome)+(S.prova.cargo?' · '+escHtml(S.prova.cargo):'')+(S.prova.bancaEdital?' · banca '+S.prova.bancaEdital:' · banca a definir')+(S.prova.semEdital?' · edital ainda não publicado':S.prova.data?' · prova em '+S.prova.data:'')+'.'}${S.prova.fonte==='exemplo'&&S.edModo==='arquivo'&&S.arquivos.some(a=>a.file)?'<br><span style="font-size:13px">PDF e Word não são lidos neste protótipo: estas matérias são o exemplo. No app, a IA lê o arquivo.</span>':''}</div>` : ''}
      ${S.edStatus==='erro' ? `<div class="erro"><b>${S.erroLeitura ? escHtml(S.erroLeitura) : 'Não encontrei a lista de matérias.'}</b><br>Pode ser um PDF escaneado (imagem), uma planilha sem a coluna das matérias ou só o aviso de abertura do concurso. Tente o edital completo, outro arquivo, ou cole o trecho do conteúdo programático.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sec" onclick="escolherEdital('arquivo')">Anexar outro arquivo</button><button class="btn sec" onclick="escolherEdital('texto')">Colar o texto</button></div>` : ''}
    </div>`;
  }
  let entrada = '';
  if(S.edStatus==='ocioso' && S.edModo==='arquivo'){
    const lista = S.arquivos.map((a,i)=>`<li class="arq">${ico(TIPOS[a.tipo].ico)}<span class="arq-nome">${a.nome}</span><span class="arq-tipo">${TIPOS[a.tipo].rot}</span>
      <button class="arq-x" onclick="removerArquivo(${i})" aria-label="Remover ${a.nome}">${ico('x')}</button></li>`).join('');
    entrada = `<div class="soltar" id="soltar"
        ondragover="event.preventDefault();this.classList.add('sobre')" ondragleave="this.classList.remove('sobre')"
        ondrop="event.preventDefault();this.classList.remove('sobre');addArquivos(event.dataTransfer.files)">
        ${ico('upload')}<p>Arraste os arquivos aqui ou escolha no computador ou no celular.</p>
        <div class="formatos"><span>${ico('doc')} PDF</span><span>${ico('sheet')} Excel, CSV</span><span>${ico('doc')} Word, TXT</span></div>
        <label class="btn" for="edArq">Escolher arquivos</label>
        <input type="file" id="edArq" multiple accept="${ACEITOS}" onchange="addArquivos(this.files)" hidden>
      </div>
      ${S.recusados && S.recusados.length ? `<p class="erro" style="margin:12px 0 0">Não consigo ler ${S.recusados.join(', ')}. Use PDF, planilha (Excel, CSV) ou documento (Word, TXT).</p>` : ''}
      ${S.arquivos.length ? `<ul class="arqs">${lista}</ul>
        <p class="dim" style="font-size:13px;margin:10px 0 14px">Pode juntar mais de um: o edital e a retificação, ou o PDF e uma planilha sua com os pesos.</p>
        <button class="btn" onclick="lerEdital()">Ler ${S.arquivos.length>1?`os ${S.arquivos.length} arquivos`:'o arquivo'}</button>`
      : `<p class="exemplo">Sem arquivo à mão neste protótipo? Use um exemplo:
          <button class="mini" onclick="arquivoExemplo('pdf')">edital em PDF</button> ·
          <button class="mini" onclick="arquivoExemplo('planilha')">planilha</button> ·
          <button class="mini" onclick="arquivoExemplo('doc')">documento Word</button></p>`}`;
  }
  if(S.edStatus==='ocioso' && S.edModo==='texto'){
    entrada = `<label class="f" for="edTexto">Cole o conteúdo programático</label><textarea id="edTexto" rows="7" placeholder="Cole do jeito que estiver no edital: nomes das matérias, número de questões e assuntos."></textarea>
       <div style="margin-top:12px"><button class="btn" onclick="lerEdital()">Organizar com IA</button></div>`;
  }
  return `<h1>O que você vai estudar?</h1>
    <p class="lead">Mande o edital ou o programa da prova, do jeito que você tiver. A IA separa as matérias, os pesos e os assuntos, e você confere no próximo passo.</p>
    ${S.edStatus==='ocioso' ? `<div class="escolha">
      <button class="opcao ${S.edModo==='arquivo'?'on':''}" onclick="escolherEdital('arquivo')">${ico('upload')}<b>Anexar arquivo</b><span>PDF do edital, planilha ou documento Word. Pode ser mais de um.</span></button>
      <button class="opcao ${S.edModo==='texto'?'on':''}" onclick="escolherEdital('texto')">${ico('paste')}<b>Colar o texto</b><span>Copie o trecho das matérias de qualquer lugar e cole aqui.</span></button>
    </div>` : ''}
    ${entrada}${estado}`;
}

function passoMaterias(){
  const total = S.materias.reduce((a,m)=>a+m.peso,0) || 1;
  const max = Math.max(1, ...S.materias.map(m=>m.peso));
  const chance = S.prova.pesoTipo==='chance';
  const lista = S.materias.map((m,i)=>`
    <div class="materia ${S.abertas[i]?'aberta':''}">
      <div class="materia-cab" onclick="abrirMateria(${i})" role="button" tabindex="0" aria-expanded="${!!S.abertas[i]}">
        <div><b>${escHtml(m.nome)}</b><div class="meta">${m.faixa?escHtml(m.faixa)+' · ':''}${m.topicos.length} ${m.topicos.length===1?'tópico':'tópicos'}</div></div>
        <div class="peso"><span class="peso-barra"><i style="width:${m.peso/max*100}%"></i></span><span class="num">${chance ? m.peso+'%' : Math.round(m.peso/total*100)+'%'}</span></div>
        ${ico('chev','chev')}
      </div>
      <div class="topicos"><ul>${m.topicos.map((t,j)=>`<li><span>${escHtml(t)}</span><button class="mini" onclick="removerTopico(${i},${j})">remover</button></li>`).join('')}</ul>
        <div style="display:flex;justify-content:space-between;margin-top:6px"><button class="mini" onclick="adicionarTopico(${i})">+ adicionar tópico</button>
        <button class="mini" style="color:var(--danger)" onclick="removerMateria(${i})">remover matéria</button></div></div>
    </div>`).join('');
  const nova = S.novaMat ? `<div class="materia nova">
      <div class="campo-f"><label class="f" for="nmNome">Nome da matéria</label><input type="text" id="nmNome" value="${escHtml(S.novaMat.nome)}" oninput="S.novaMat.nome=this.value" placeholder="Ex.: Língua Inglesa"></div>
      <div class="campo-f"><label class="f" for="nmPeso">${chance?'Chance de cair (%)':'Peso (pontos na prova)'}</label><input type="text" id="nmPeso" inputmode="decimal" value="${escHtml(S.novaMat.peso)}" oninput="S.novaMat.peso=this.value" style="max-width:140px"></div>
      <div class="campo-f"><label class="f" for="nmTop">Tópicos, um por linha (opcional)</label><textarea id="nmTop" rows="3" oninput="S.novaMat.topicos=this.value" placeholder="Interpretação de texto">${escHtml(S.novaMat.topicos)}</textarea></div>
      <div style="display:flex;gap:8px"><button class="btn" onclick="salvarMateria()">Adicionar</button><button class="btn sec" onclick="S.novaMat=null;render(true)">Cancelar</button></div>
    </div>` : `<button class="btn sec" style="width:100%;margin-top:4px" onclick="S.novaMat={nome:'',peso:'',topicos:''};render(true);setTimeout(()=>document.getElementById('nmNome').focus())">+ Adicionar matéria que faltou</button>`;
  return `<h1>Confira o que foi lido</h1>
    <p class="lead">${chance
      ? 'Sua planilha traz a chance de cada matéria cair: é isso que decide quanto tempo cada uma recebe. Faltou alguma? Adicione no fim da lista.'
      : 'A barra mostra quanto cada matéria vale na nota. É isso que decide quanto tempo cada uma recebe na sua trilha. Faltou alguma? Adicione no fim da lista.'}</p>
    ${S.prova.semEdital ? '<div class="aviso" style="margin-bottom:14px">O edital ainda não saiu. Os pesos vêm da sua planilha; quando o edital for publicado, é só atualizar.</div>' : ''}
    ${lista}${nova}
    <div class="total"><span>${S.materias.length} matérias · ${S.materias.reduce((a,m)=>a+m.topicos.length,0)} tópicos</span><span class="num">${chance?'peso = chance de cair':total+' pontos'}</span></div>`;
}
function removerMateria(i){ if(confirm('Remover "'+S.materias[i].nome+'" da trilha?')){ S.materias.splice(i,1); S.abertas={}; render(true); } }
function salvarMateria(){
  const n = S.novaMat, nome = n.nome.trim();
  if(!nome){ document.getElementById('nmNome').focus(); return; }
  const peso = parseFloat(String(n.peso).replace(',','.')) || (S.prova.pesoTipo==='chance' ? 50 : 1);
  const topicos = String(n.topicos).split('\n').map(t=>t.trim()).filter(Boolean);
  S.materias.push({nome, peso, topicos: topicos.length ? topicos : ['Conteúdo geral de '+nome], faixa:'Adicionada por você', chance: S.prova.pesoTipo==='chance'});
  S.novaMat = null; S.abertas = {[S.materias.length-1]: true}; render(true);
}

/* Mais de uma banca: concurso cujo edital ainda não saiu, em que se aposta
   em FGV ou Cebraspe, por exemplo. As questões alternam entre os estilos. */
function bancasTxt(){ return S.bancas.join(' ou ') || 'da banca'; }
// As questões do protótipo são de múltipla escolha: só alternam entre as
// bancas desse formato (as de Certo/Errado geram itens C/E no app real).
function bancaDaQuestao(k){
  const me = S.bancas.filter(n=>!/^Certo/.test(formatoDe(n)));
  const lista = me.length ? me : S.bancas;
  return lista[k % Math.max(1, lista.length)] || 'da banca';
}
function formatoDe(nome){ const b = BANCAS.find(x=>x.n===nome); return b ? b.f : 'A IA identifica pelas provas encontradas'; }

  return `<h1>Qual é a banca?</h1>

      ${!lista.length && !extras.length ? '<span class="dim" style="font-size:14px">Nenhuma banca com esse nome na lista.</span>' : ''}
    </div>
    <label class="f" for="bOutra">Não está na lista? Escreva e adicione</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="bOutra" placeholder="Ex.: Instituto Selecon" value="${escHtml(S.bancaOutra)}" oninput="S.bancaOutra=this.value" onkeydown="if(event.key==='Enter')adicionarBancaOutra()">
      <button class="btn sec" onclick="adicionarBancaOutra()">Adicionar</button>
    </div>
    ${S.bancas.length ? `<div class="ficha" style="margin-top:18px"><dl>
      <dt>${varias?'Bancas':'Banca'}</dt><dd>${S.bancas.map(escHtml).join(' ou ')}${varias?' <span class="dim">(a definir)</span>':''}</dd>

/* Planilha não precisa de IA: acha as colunas pelo nome (Matéria, Tópicos,
   Peso ou Chance de cair, Faixa) e monta as matérias. PDF e Word seguem o
   exemplo fictício no protótipo; no app real quem lê é a IA. */
const semAcento = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function dividirTopicos(txt){
  return String(txt||'').split(/[;\n•]|,(?![^(]*\))/).map(t=>t.trim().replace(/\.$/,'')).filter(Boolean)
    .map(t=>t.charAt(0).toUpperCase()+t.slice(1));
}
async function lerPlanilha(file){
  if(typeof XLSX === 'undefined') throw new Error('o leitor de planilhas não carregou');
  const wb = XLSX.read(await file.arrayBuffer());
  let melhor = null, todoTexto = '';
  for(const aba of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[aba], {header:1, defval:'', raw:true});
    todoTexto += ' ' + rows.map(r=>r.join(' ')).join(' ');
    const hi = rows.findIndex(r => r.some(c => /^(materia|disciplina)s?\b/.test(semAcento(c).trim())));
    if(hi < 0) continue;
    const h = rows[hi].map(semAcento);
    const col = re => h.findIndex(c => re.test(c));
    const c = {m: col(/^(materia|disciplina)/), t: col(/topico|assunto|conteudo/), p: col(/peso|pontos|questoes|valor/),
               ch: col(/chance|probab|incidencia|relevancia/), f: col(/faixa|prioridade|grupo|bloco|modulo/)};
    const dados = rows.slice(hi+1).filter(r => String(r[c.m]).trim());
    if(!melhor || dados.length > melhor.dados.length) melhor = {aba, rows, hi, c, dados};
  }
  if(!melhor || !melhor.dados.length) throw new Error('não achei uma coluna "Matéria" com conteúdo');
  const {rows, hi, c, dados} = melhor;
  const mats = [];
  for(const r of dados){
    const nome = String(r[c.m]).trim();
    let m = mats.find(x => semAcento(x.nome) === semAcento(nome));
    if(!m){ m = {nome, peso:1, topicos:[], faixa: c.f>=0 ? String(r[c.f]).trim() : ''}; mats.push(m); }
    if(c.t >= 0) dividirTopicos(r[c.t]).forEach(t => { if(!m.topicos.includes(t)) m.topicos.push(t); });
    const num = v => { const n = parseFloat(String(v).replace('%','').replace(',','.')); return isNaN(n) ? null : n; };
    if(c.p >= 0 && num(r[c.p]) !== null) m.peso = num(r[c.p]);
    else if(c.ch >= 0 && num(r[c.ch]) !== null){ const v = num(r[c.ch]); m.peso = Math.round(v <= 1 ? v*100 : v); m.chance = true; }
  }
  mats.forEach(m => { if(!m.topicos.length) m.topicos = ['Conteúdo geral de ' + m.nome]; });
  mats.sort((a,b) => b.peso - a.peso);
  const titulo = rows.slice(0, hi).map(r => r.find(x => String(x).trim())).filter(Boolean)[0] || '';
  const [nomeProva, ...resto] = String(titulo).split(/\s+[–—-]\s+/);
  const txt = semAcento(todoTexto);
  const aDefinir = /banca (ainda )?nao (foi )?definida|banca a definir|sem banca/.test(txt);
  const banca = aDefinir ? null : (BANCAS.find(b => new RegExp('\\b'+semAcento(b.n)+'\\b').test(txt)) || {}).n || null;
  return {materias: mats, prova: {
    nome: nomeProva || file.name.replace(/\.[^.]+$/,''), cargo: resto.join(' – '),
    bancaEdital: banca, bancaADefinir: aDefinir || !banca,
    semEdital: /edital (ainda )?nao (foi )?publicado|edital ainda nao|sem edital|antes do edital/.test(txt),
    pesoTipo: mats.some(m => m.chance) ? 'chance' : (c.p >= 0 ? 'pontos' : 'igual'), fonte:'planilha', data:'' }};
}

function lerEdital(){
  S.edStatus='lendo'; S.edPasso=0; S.erroLeitura=null; render();
  const real = S.edModo==='arquivo' ? S.arquivos.find(a => a.tipo==='planilha' && a.file) : null;
  const leitura = real ? lerPlanilha(real.file).then(r => ({ok:r}), e => ({erro:e.message})) : Promise.resolve(null);
  const limite = S.simularErro ? 2 : passosLeitura().length;
  const t = setInterval(async ()=>{
    S.edPasso++;
    if(S.edPasso>=limite){
      clearInterval(t);
      const res = await leitura;
      if(S.simularErro){ S.edStatus='erro'; }
      else if(res && res.erro){ S.edStatus='erro'; S.erroLeitura = 'Não consegui ler ' + real.nome + ': ' + res.erro + '.'; }
      else if(res && res.ok){
        S.materias = res.ok.materias; S.prova = res.ok.prova; S.abertas = {};
        S.bancas = S.prova.bancaEdital ? [S.prova.bancaEdital] : [];
        S.edStatus='pronto';
      } else { S.materias = JSON.parse(JSON.stringify(MATERIAS_BASE)); S.prova = provaExemplo(); S.bancas=[]; S.edStatus='pronto'; }
    }
    render();
  }, 650);
}

function planoDoDia(){
  const itens = [];

/* ------------------------- estudo ------------------------- */
/* Cada tópico segue a estrutura de estudo do Victor, em nove seções:
   1 storytelling real, 2 resumo em 1 minuto, 3 resumo em 5 minutos,
   4 mapa visual, 5 analogias, 6 questões sem resposta marcada,
   7 gabarito e comentários separados, 8 checklist de 30 segundos,
   9 flashcards. Na tela elas se agrupam em quatro partes: Teoria (1, 2, 3, 5),
   Mapa (4), Questões (6, 7) e Revisão (8, 9). No app a IA gera tudo isso;
   no protótipo há dois tópicos escritos como exemplo. */
const CONTEUDOS = {
  'Crase': {
    tempo: 15,
    historia: `<p>No português antigo era comum escrever duas vogais iguais lado a lado: "vou <b>a a</b> feira". Na fala, as duas sempre se juntaram num som só. A escrita passou a registrar essa fusão com um sinal próprio, o acento grave: "vou <b>à</b> feira".</p>
      <p>O nome vem do grego <i>krâsis</i>, "mistura". Crase não é o acento: é a mistura de dois "a". O acento grave só avisa que ela aconteceu.</p>`,
    resumo1: [

    resumo5: `<h3>1. Quando ocorre</h3><p>A palavra de antes exige a preposição <b>a</b> ("ir a", "referir-se a") e a palavra de depois aceita o artigo <b>a</b> (é feminina e determinada).</p>
      <h3>2. Dois truques que resolvem quase tudo</h3><p><b>Masculino:</b> "Vou <b>à</b> escola" → "Vou <b>ao</b> colégio". Apareceu "ao", tem crase.<br><b>Lugar:</b> "volto <b>da</b>" → crase; "volto <b>de</b>" → sem crase. "Vou <b>à</b> Bahia" (volto da Bahia), "Vou <b>a</b> Curitiba" (volto de Curitiba).</p>

      <table><thead><tr><th>Quando</th><th>Exemplos</th></tr></thead><tbody>

        <tr><td><b>Proibida</b></td><td>Antes de masculino, de verbo, de pronome pessoal (<i>a ele</i>); entre palavras repetidas (<i>frente a frente</i>); "a" no singular antes de plural (<i>a pessoas</i>).</td></tr>
        <tr><td><b>Facultativa</b></td><td>Antes de possessivo feminino no singular (<i>à/a minha casa</i>), de nome de mulher (<i>à/a Maria</i>) e depois de "até" (<i>até à/a praia</i>).</td></tr>

/* Cebraspe: um bloco com texto-base ou situação hipotética e itens para
   julgar. Cada item vira uma "questão" de duas opções (Certo/Errado), assim a
   correção e os indicadores funcionam igual aos da múltipla escolha. */
function blocoCE(topico, base, comando, itens){
  return itens.map(([item, certo, just]) => ({real:false, ce:true, topico, base, comando, item, enun:item, alts:['Certo','Errado'], c: certo?0:1, just}));
}

/* Mapa visual animado: o tema no centro, os ramos se desenham para fora e os
   itens aparecem em sequência. Clicar num ramo destaca só ele. No celular vira
   uma árvore vertical (o radial ficaria ilegível). Sem movimento quando o
   sistema pede movimento reduzido. */
function quebrar(txt, max){
  const linhas = []; let l = '';
  String(txt).split(' ').forEach(p => { if((l+' '+p).trim().length > max && l){ linhas.push(l); l = p; } else l = (l+' '+p).trim(); });
  if(l) linhas.push(l); return linhas;
}
// Mapa mental clássico: ramos alternando à direita e à esquerda do centro,
// itens empilhados em coluna ao lado de cada ramo; nada se sobrepõe.
function mapaRadial(mapa, foco){
  const [centro, ramos] = mapa;
  const W = 1120, cx = W/2, LH = 17, GAP = 10, GAPR = 22;
  const lados = [[], []];
  ramos.forEach((r,k) => lados[k%2].push({r, k}));
  const medir = folhas => folhas.map(f => { const ls = quebrar(f, 32); return {ls, h: 14 + ls.length*LH}; });
  const altLado = lado => lado.reduce((t,{r}) => t + Math.max(40, medir(r[1]).reduce((a,x)=>a+x.h+GAP,0)-GAP) + GAPR, -GAPR);
  const H = Math.max(260, Math.max(...lados.map(altLado)) + 40);
  const cy = H/2;
  let linhas = '', nos = '', ordem = 0;
  const larg = ls => Math.min(300, Math.max(...ls.map(l=>l.length))*7.3 + 28);
  lados.forEach((lado, sIdx) => {
    const dir = sIdx===0 ? 1 : -1;
    let y = cy - altLado(lado)/2;
    lado.forEach(({r:[rot, folhas], k}) => {
      const med = medir(folhas);
      const bloco = Math.max(40, med.reduce((a,x)=>a+x.h+GAP,0)-GAP);
      const by = y + bloco/2, bx = cx + dir*210;
      const apagado = foco!==null && foco!==undefined && foco!==k ? ' apagado' : '';
      const dB = (ordem++)*0.14;
      linhas += `<path class="m-lig${apagado}" pathLength="1" style="animation-delay:${dB}s" d="M${cx+dir*60},${cy} C${cx+dir*130},${cy} ${cx+dir*120},${by} ${bx-dir*55},${by}"/>`;
      let fy = y;
      med.forEach(({ls, h}, j) => {
        const w = larg(ls), x0 = dir>0 ? cx+dir*320 : cx+dir*320 - w, my = fy + h/2;
        const dF = 0.45 + dB + j*0.07;
        linhas += `<path class="m-lig m-fina${apagado}" pathLength="1" style="animation-delay:${dF-.12}s" d="M${bx+dir*55},${by} C${bx+dir*85},${by} ${bx+dir*80},${my} ${dir>0?x0:x0+w},${my}"/>`;
        nos += `<g class="m-folha${apagado}" style="animation-delay:${dF}s"><rect x="${x0}" y="${fy}" width="${w}" height="${h}" rx="${Math.min(15,h/2)}"/>${ls.map((l,i)=>`<text x="${x0+w/2}" y="${fy+7+LH*(i+1)-4}" text-anchor="middle">${escHtml(l)}</text>`).join('')}</g>`;
        fy += h + GAP;
      });
      const wb = Math.min(230, rot.length*8 + 34);
      nos += `<g class="m-ramo${apagado}" style="animation-delay:${dB+.22}s" role="button" tabindex="0" onclick="S.estudo.focoMapa=S.estudo.focoMapa===${k}?null:${k};render(true)"
        onkeydown="if(event.key==='Enter'){S.estudo.focoMapa=S.estudo.focoMapa===${k}?null:${k};render(true)}" aria-label="Destacar ${escHtml(rot)}">
        <rect x="${bx-wb/2}" y="${by-19}" width="${wb}" height="38" rx="19"/><text x="${bx}" y="${by+5}" text-anchor="middle">${escHtml(rot)}</text></g>`;
      y += bloco + GAPR;
    });
  });
  const cl = quebrar(centro, 18), wc = Math.min(240, Math.max(...cl.map(l=>l.length))*9.5 + 36), hc = 26 + cl.length*20;
  nos += `<g class="m-centro"><rect x="${cx-wc/2}" y="${cy-hc/2}" width="${wc}" height="${hc}" rx="18"/>${cl.map((l,i)=>`<text x="${cx}" y="${cy-hc/2+13+20*(i+1)-5}" text-anchor="middle">${escHtml(l)}</text>`).join('')}</g>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="mapa-radial" role="img" aria-label="Mapa visual de ${escHtml(centro)}">${linhas}${nos}</svg>`;
}
function mapaArvoreAnimada(no, nivel=0, cont={i:0}){
  const [rot, filhos] = Array.isArray(no) ? no : [no, null];
  const atraso = (cont.i++)*0.06;
  return `<li style="animation-delay:${atraso}s" class="n${nivel}"><span>${escHtml(rot)}</span>${filhos ? `<ul>${filhos.map(f=>mapaArvoreAnimada(f, nivel+1, cont)).join('')}</ul>` : ''}</li>`;
