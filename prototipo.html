      `<ol class="gab">${L.map((q,k)=>`<li class="${E.resp[k]===q.c?'ok':'nao'}"><b>${q.ce ? q.alts[q.c] : 'abcde'[q.c]}</b> — ${q.just}</li>`).join('')}</ol>`, 'id="gabarito"') : '';
    corpo = `<div class="secao" style="padding:14px 18px"><span class="f" style="margin-bottom:8px">Quantas questões agora?</span>${escolhaQtd(pedidas, 'definirQtdTopico')}${avisoQtd(pedidas, (QUESTOES_TOPICO[E.topico]||[]).length)}</div>
      <p class="dim" style="font-size:14px;margin:0 0 12px">${L.length} questões geradas a partir da teoria, no estilo ${bancasTxt()}. Responda todas; o gabarito aparece separado depois.</p>
      ${lista}${gab}
      <div class="fim-estudo">${E.corrigido
        ? `<button class="btn" onclick="irParte('revisao')">Ir para a revisão</button><button class="btn sec" onclick="S.estudo.resp={};S.estudo.corrigido=false;window.scrollTo(0,0);render()">Refazer</button>`
        : `<button class="btn" onclick="corrigirTopico()">Corrigir (${Object.keys(E.resp).length}/${L.length} respondidas)</button>`}</div>`;
  }
  if(E.parte==='revisao'){
    const L = questoesDoTopico(E);
    const ac = L.filter((q,k)=>E.resp[k]===q.c).length;
    const foiMal = E.corrigido && L.length && ac/L.length < .7;
    corpo = secao('Checklist — 30 segundos', `<ul class="check">${C.checklist.map(x=>`<li>${ico('check')}<span>${escHtml(x)}</span></li>`).join('')}</ul>`)
      + secao('Flashcards', `<p class="dim" style="font-size:14px;margin:0 0 12px">Responda de cabeça e toque para ver.</p><div class="cards">${C.flashcards.map(([q,a],k)=>
          `<button class="card-f ${E.flip[k]?'virado':''}" onclick="S.estudo.flip[${k}]=!S.estudo.flip[${k}];render(true)" aria-pressed="${!!E.flip[k]}"><span class="lado-q">${escHtml(q)}</span>${E.flip[k]?`<span class="lado-a">${escHtml(a)}</span>`:'<span class="toque">tocar para ver</span>'}</button>`).join('')}</div>`)
      + secao('Quando este tópico volta', `<p>${!E.corrigido ? 'Faça e corrija as questões para o SIPC calibrar a revisão.' : foiMal
          ? `Você acertou <b class="num">${ac}/${L.length}</b>. Abaixo de 70%, o tópico entra em "Precisa de atenção" no painel.`
          : `Você acertou <b class="num">${ac}/${L.length}</b>.`} ${E.rev ? '' : `Este tópico volta em <b>24 horas</b> (${dataMais(1)}), em <b>7 dias</b> (${dataMais(7)}) e em <b>30 dias</b> (${dataMais(30)}).`}</p>
          ${escadaHTML(E.rev ? E.rev.etapa : 0)}`)
      + (E.rev ? avaliacaoRevisao(E)
        : `<div class="fim-estudo"><button class="btn" onclick="concluirItem()">Concluir o tópico</button>${!E.corrigido?`<button class="btn sec" onclick="irParte('questoes')">Fazer as questões</button>`:''}</div>`);
  }
  return `<div class="leitor">${cab}${corpo}</div>`;
}

/* ------------------------- questões ------------------------- */
/* emEstudo: o bloco de questões aparece dentro do estudo de um tópico, sem o
   cabeçalho próprio e terminando na parte de revisão. */
function vistaQuiz(emEstudo){
  const Q = S.quiz, L = Q.lista || QUESTOES;
  if(!L.length) return `<div class="aviso">No app, a IA gera as questões deste tópico.</div>`;
  if(Q.i >= L.length) return placar(emEstudo);
  const q = L[Q.i], letras = q.ce ? 'CE' : 'ABCDE';
  const pontos = L.map((_,k)=>`<i class="${k<Q.res.length?(Q.res[k]?'c':'e'):k===Q.i?'a':''}"></i>`).join('');
  const alts = q.alts.map((a,k)=>{
    let cls = '';
    if(Q.conf){ if(k===q.c) cls='certa'; else if(k===Q.sel) cls='errada'; }
    else if(k===Q.sel) cls='sel';
    const marca = Q.conf && k===q.c ? ico('check') : Q.conf && k===Q.sel ? ico('x') : '';
    return `<button class="alt ${cls}" ${Q.conf?'disabled':''} onclick="S.quiz.sel=${k};render(true)"><span class="letra">${letras[k]}</span><span>${a}</span>${marca}</button>`;
  }).join('');
  const acertou = Q.sel===q.c;
  return `<div class="quiz">
    ${emEstudo ? '' : `<button class="voltar" onclick="sair()">${ico('back')} Plano de hoje</button>`}
    ${!emEstudo && Q.i===0 && !Q.conf ? avisoQtd(Q.custom ? Q.custom.pedidas : S.qtdQuestoes, L.length) : ''}
    ${Q.custom && Q.i===0 && !Q.conf ? `<p class="dim" style="font-size:13px;margin:0 0 8px">Revisão: ${escHtml(Q.custom.nomes.join(', '))}</p>` : ''}
    <div class="quiz-cab"><span class="dim" style="font-size:14px">Questão <span class="num">${Q.i+1}</span> de <span class="num">${L.length}</span> · ${q.topico}</span><div class="pontos" aria-hidden="true">${pontos}</div></div>
    <article class="questao">
      ${q.real ? `<span class="origem real">${ico('doc')} Prova oficial · ${q.fonte}</span>` : `<span class="origem ined">${ico('spark')} ${q.ce ? 'Item inédito no estilo Cebraspe · julgue Certo ou Errado' : 'Inédita no estilo '+bancaDaQuestao(Q.i)}${emEstudo?' · baseada na teoria':''}</span>`}
      ${enunciado(q.enun)}
      <div class="alts" role="radiogroup">${alts}</div>
      ${emEstudo ? "" : rascunhoHTML("d"+Q.i, q.topico)}
      ${Q.conf ? `<div class="gabarito ${acertou?'ok':'nao'}" aria-live="polite"><b>${acertou?'Você acertou.':q.ce?`Você errou. O gabarito é ${q.alts[q.c]}.`:`Errado. A resposta é a letra ${letras[q.c]}.`}</b><p>${q.just}</p>
        ${q.real ? `<div class="fonte">${ico('link')} <a href="#" onclick="alert('No app: abre o PDF oficial da prova e o gabarito definitivo publicados pela banca.');return false">Ver prova e gabarito oficiais</a></div>` : ''}
        ${!acertou && !emEstudo ? `<div class="fonte">"${q.topico}" volta para revisão amanhã.</div>` : ''}</div>` : ''}
      <div class="quiz-acoes">
        ${Q.conf ? `<button class="btn" onclick="proxima()">${Q.i+1<L.length?'Próxima questão':'Ver resultado'}</button>`
                 : `<button class="btn" ${Q.sel===null?'disabled':''} onclick="confirmar()">Confirmar resposta</button>`}
      </div>
    </article>
  </div>`;
}
function confirmar(){ const L = S.quiz.lista || QUESTOES; S.quiz.conf=true; S.quiz.res.push(S.quiz.sel===L[S.quiz.i].c); render(true); }
function proxima(){ S.quiz.i++; S.quiz.sel=null; S.quiz.conf=false; render(); }
function placar(emEstudo){
  registrarRevisaoMontada();
  const Q = S.quiz, L = Q.lista || QUESTOES, ac = Q.res.filter(Boolean).length;
  const erros = L.filter((q,k)=>!Q.res[k]);
  const tops = [...new Set(erros.map(q=>q.topico))];
  return `<div class="quiz"><div class="questao placar">
    <h2>Resultado</h2><span class="num">${ac}/${L.length}</span>
    <p class="dim">${ac===L.length?'Tudo certo. Os tópicos seguem na revisão no intervalo normal.':'Cada erro vira revisão no momento certo, sem você precisar anotar nada.'}</p>
    ${tops.length && !emEstudo ? `<ul>${tops.map(t=>`<li>${ico('info')}<span><b>${t}</b> volta para revisão amanhã</span></li>`).join('')}</ul>` : ''}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">
      ${emEstudo ? `<button class="btn" onclick="irParte('revisao')">Ir para a revisão do tópico</button>`
                 : Q.custom ? `<button class="btn" onclick="S.vista=null;S.aba='revisoes';window.scrollTo(0,0);render()">Ver indicadores</button>`
                 : `<button class="btn" onclick="concluirItem()">Voltar ao plano de hoje</button>`}
      <button class="btn sec" onclick="S.quiz.i=0;S.quiz.sel=null;S.quiz.conf=false;S.quiz.res=[];render()">Refazer</button>
    </div></div></div>`;
}

/* ------------------------- revisão 1-7-30 -------------------------
   Regra do SIPC: todo tópico estudado volta em 24 horas, em 7 dias e em
   30 dias. "Lembrei" leva à próxima etapa; depois da de 30 dias o tópico está
   consolidado. "Esqueci" recomeça em 24 horas; "Difícil" repete a etapa. */
const ETAPAS = [{dias:1, rot:'24 horas', curto:'24h'}, {dias:7, rot:'7 dias', curto:'7d'}, {dias:30, rot:'30 dias', curto:'30d'}];
const INTERV = ETAPAS.map(e=>e.dias);
// Revisões que vencem hoje: o que foi estudado ontem, há 7 e há 30 dias.
function revisoesDeHoje(){
  if(S.semRevisoes) return [];
  const tem = re => S.materias.find(m => re.test(semAcento(m.nome)));
  const port = tem(/portugu/), adm = tem(/administrativo/);
  const lista = [];
  const ontem = port ? {t:'Pontuação', m:port.nome} : {t:S.materias[1].topicos[0], m:S.materias[1].nome};
  lista.push({id:'r0', ...ontem, etapa:0});
  lista.push({id:'r1', t:'Crase', m:port ? port.nome : 'Língua Portuguesa', etapa:1});
  if(adm) lista.push({id:'r2', t:'Atos administrativos', m:adm.nome, etapa:2});
  return lista;
}
const CARTOES = new Proxy({}, { get: (_, id) => revisoesDeHoje().find(r=>r.id===id) || {t:'Crase', m:'Língua Portuguesa', etapa:1} });
const quandoFoi = e => e===0 ? 'estudado ontem' : e===1 ? 'estudado há 7 dias' : 'estudado há 30 dias';
function dataMais(n){ const d = new Date(HOJE); d.setDate(d.getDate()+n); return fmtData(d,{day:'2-digit',month:'2-digit'}); }
function escadaHTML(atual){ return `<div class="escada" aria-label="Revisões em 24 horas, 7 dias e 30 dias">${ETAPAS.map((e,i)=>`<span class="${i===atual?'on':i<atual?'feita':''}">${e.curto}</span>`).join('')}</div>`; }
function alertaDoDia(){
  const rev = revisoesDeHoje(), novos = topicosParaHoje().slice(0, S.horas>=1.5?3:2);
  return `<div class="alerta" role="status">
    <div class="alerta-cab">${ico('info')}<b>Seu dia: ${rev.length} ${rev.length===1?'revisão':'revisões'} e ${novos.length} tópicos novos</b></div>
    ${rev.length ? `<p><span class="dim">Revisar hoje:</span> ${rev.map(r=>`<b>${escHtml(r.t)}</b> <span class="dim">(${ETAPAS[r.etapa].rot})</span>`).join(' · ')}</p>` : '<p class="dim">Nenhuma revisão vence hoje.</p>'}
    <p><span class="dim">Estudar hoje:</span> ${novos.map(x=>`<b>${escHtml(x.top)}</b>`).join(' · ')}. <span class="dim">Voltam amanhã, em ${dataMais(7)} e em ${dataMais(30)}.</span></p>
  </div>`;
}

/* ------------------------- outras abas ------------------------- */
function abaTrilha(){
  const porDia = ritmo().topDia;
  const fila = [];
  S.materias.forEach(m => m.topicos.forEach((t,j) => fila.push({t, m:m.nome, k:(j+.5)/m.topicos.length, p:m.peso})));
  fila.sort((a,b) => a.k-b.k || b.p-a.p);
  // simula 40 dias: o que se estuda no dia d volta em d+1, d+7 e d+30
  const estudado = {}, vence = {};
  const hojeRev = revisoesDeHoje();
  vence[0] = hojeRev.map(r=>({t:r.t, e:r.etapa}));
  let pendentes = [];
  const dias = []; const d = new Date(HOJE);
  for(let i=0; i<40; i++){
    const dow = (d.getDay()+6)%7, estuda = S.dias[dow];
    const venceHoje = (vence[i]||[]).concat(pendentes);
    if(estuda){
      // hoje: os mesmos tópicos do plano do dia
      if(i===0){ const hoje = topicosParaHoje().slice(0, S.horas>=1.5?3:2).map(x=>({t:x.top, m:x.mat})); estudado[i] = hoje; hoje.forEach(h=>{ const k = fila.findIndex(f=>f.t===h.t); if(k>-1) fila.splice(k,1); }); }
      else estudado[i] = fila.splice(0, porDia);
      estudado[i].forEach(x => ETAPAS.forEach((e,k) => (vence[i+e.dias] = vence[i+e.dias] || []).push({t:x.t, e:k})));
      pendentes = [];
    } else pendentes = venceHoje; // revisão de folga passa para o próximo dia de estudo
    if(dias.length < 6){
      const rot = i===0 ? 'Hoje' : i===1 ? 'Amanhã' : fmtData(d,{weekday:'long'}).replace(/^./,c=>c.toUpperCase());
      const sub = fmtData(d,{weekday:'short',day:'2-digit',month:'2-digit'});
      if(estuda) dias.push([rot, sub, estudado[i], venceHoje]);
      else if(i<=1) dias.push([rot, sub, null, []]);
    }
    d.setDate(d.getDate()+1);
  }
  return `<p class="dim" style="margin:0 0 14px;font-size:14px">Todo tópico estudado volta em 24 horas, em 7 dias e em 30 dias. As revisões que caem na sua folga passam para o próximo dia de estudo.</p>
    ${dias.map(([dd,sub,novos,revs])=>`<div class="trilha-dia"><div class="d">${dd}<span>${sub}</span></div><div>
      ${novos ? `<ul>${novos.map(x=>`<li>${escHtml(x.t)} <span class="dim">· ${escHtml(x.m)}</span></li>`).join('')}</ul>` : '<p class="dim" style="margin:0">Folga: fora do seu ritmo</p>'}
      ${revs.length ? `<p class="trilha-rev"><b>Revisar:</b> ${revs.map(r=>`${escHtml(r.t)} <span class="tag rev">${ETAPAS[r.e].curto}</span>`).join(' ')}</p>` : ''}
    </div></div>`).join('')}`;
}
function abaRevisoes(){
  const rev = revisoesDeHoje(), novos = topicosParaHoje();
  return `<div class="rev-grid"><div><h3 class="sub-h" style="margin-top:0">Ciclo 24h · 7 dias · 30 dias</h3><ul class="plano">
    <li class="grupo">Vencem hoje</li>
    ${rev.length ? rev.map(r=>`<li class="item ${S.feito[r.id]?'feito':''}" onclick="abrirItem('${r.id}')"><span class="marca-check">${ico('check')}</span><div><div class="tit">${escHtml(r.t)}</div><div class="meta-item"><span class="tag rev">${ETAPAS[r.etapa].rot}</span>${escHtml(r.m)} · ${quandoFoi(r.etapa)}</div></div>${ico('chev')}</li>`).join('')
      : '<li class="item"><span></span><div class="dim">Nenhuma revisão vence hoje.</div><span></span></li>'}
    <li class="grupo">Próximos dias</li>
    ${novos.slice(0,2).map(x=>`<li class="item"><span class="marca-check"></span><div><div class="tit">${escHtml(x.top)}</div><div class="meta-item">${escHtml(x.mat)} · estudado hoje · volta em ${dataMais(1)}, ${dataMais(7)} e ${dataMais(30)}</div></div><span></span></li>`).join('')}
  </ul>${indicadoresRevHTML()}</div>${montarRevisaoHTML()}</div>`;
}

let REP = null; // rascunho do reporte aberto
async function abrirReporte(){
  REP = {tipo:null, texto:'', incluirPrint:true, print:null, capturando:true, enviado:null,
         tela:nomeTelaAtual(), disp: innerWidth<700 ? 'Celular' : 'Computador',
         quando: new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','')};
  const dlg = document.getElementById('repDlg');
  renderReporte();
  dlg.showModal();
  // O print é da tela como estava ao tocar em Reportar, sem o próprio diálogo.
  // A captura é assíncrona: se o reporte foi fechado ou trocado nesse meio
  // tempo, o resultado é descartado em vez de cair num rascunho que não é dele.
  const meu = REP;
  let print = null;
  try{
    if(typeof html2canvas === 'undefined') throw new Error('sem html2canvas');
    const canvas = await html2canvas(document.body, {
      scale: Math.min(1, 900/innerWidth), useCORS:true, logging:false,
      x: scrollX, y: scrollY, width: innerWidth, height: innerHeight,
      ignoreElements: el => el.tagName==='DIALOG' || el.hasAttribute && el.hasAttribute('data-sem-print')
    });
    print = canvas.toDataURL('image/jpeg', .72);
  }catch(e){}
  if(REP !== meu) return;
  REP.print = print;
  REP.capturando = false;
  renderReporte();
}
function fecharReporte(){ document.getElementById('repDlg').close(); REP = null; }
// O evento 'close' chega depois do close(): só zera se o diálogo continuar

function aoFecharDialogo(dlg){ if(!dlg.open) REP = null; }

/* No app real quem classifica é a IA, lendo o texto e o print. Aqui é uma
   regra por palavras só para o protótipo mostrar o resultado.
   Valor = quanto atrapalha a jornada (5 bloqueia ... 1 detalhe).
   Esforço = trabalho estimado para resolver (1 pouco ... 3 muito). */
function classificar(tipo, texto){
  const t = texto.toLowerCase();
  const area = /quest|gabarito|alternativ/.test(t) ? 'Questões' : /revis/.test(t) ? 'Revisão' : /edital|pdf|planilha|arquivo|matéria/.test(t) ? 'Edital'
             : /trilha|plano|dia/.test(t) ? 'Plano e trilha' : /cor|tela|botão|fonte|layout|escuro|cortad/.test(t) ? 'Visual' : REP.tela.split(' · ')[0];
  const esforco = /(cor|texto|botão|fonte|cortad|desalinh|escrit|palavra)/.test(t) ? 1
                : /(nova tela|integra|import|exporta|ia |inteligência|modo|aplicativo|notifica|whatsapp|offline)/.test(t) ? 3 : 2;
  if(tipo==='melhoria'){
    // ajuste só de aparência vale menos, mesmo citando uma parte importante do app
    const valor = /(visual|\bcor\b|escuro|tema|fonte|ícone)/.test(t) ? 2 : /(quest|revis|plano|trilha|edital|tempo|estudar)/.test(t) ? 4 : 3;
    return {sev:null, area, valor, esforco};
  }
  const sev = /(não (abre|carrega|salva|funciona|aparece)|trav|perdi|sumiu|apag|não consigo|erro|continuou)/.test(t) ? 'alta'
            : /(lent|demor|estranh|errad|desalinh|cortad)/.test(t) ? 'media' : 'baixa';
  return {sev, area, valor: {alta:5, media:3, baixa:2}[sev], esforco};
}
const SEV_ROT = {alta:'Bloqueia o estudo', media:'Atrapalha', baixa:'Incomoda'};
const QUAD = {
  ja:      {n:'Fazer já',  d:'Muito valor, pouco esforço'},
  planejar:{n:'Planejar',  d:'Muito valor, muito esforço'},
  encaixar:{n:'Encaixar',  d:'Pouco valor, pouco esforço'},
  depois:  {n:'Depois',    d:'Pouco valor, muito esforço'}
};
const ESF_ROT = {1:'pouco esforço', 2:'esforço médio', 3:'muito esforço'};
function quadrante(i){ const alto = i.valor>=4 || (i.tipo==='bug' && i.valor>=3), facil = i.esforco<=2;
  return alto ? (facil?'ja':'planejar') : (facil?'encaixar':'depois'); }
// Pontuação: valor pesa o dobro do esforço; bug leva um ponto a mais no empate.
function pontos(i){ return i.valor*2 - i.esforco + (i.tipo==='bug'?1:0); }

function enviarReporte(){
  const txt = document.getElementById('repTexto').value.trim();
  if(!REP.tipo || !txt) return;
  const c = classificar(REP.tipo, txt);
  const item = {id:'f'+Date.now(), tipo:REP.tipo, texto:txt, tela:REP.tela, quando:REP.quando, disp:REP.disp,
                sev:c.sev, area:c.area, valor:c.valor, esforco:c.esforco, print: REP.incluirPrint ? REP.print : null};
  BACKLOG.unshift(item); salvarBacklog();
  REP.enviado = item; renderReporte();
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let BL_FILTRO = 'todos';
function telaBacklog(){
  const ordemQ = {ja:0, planejar:1, encaixar:2, depois:3};
  const todos = BACKLOG.slice().sort((a,b)=> ordemQ[quadrante(a)]-ordemQ[quadrante(b)] || pontos(b)-pontos(a));
  const vis = todos.filter(i=> BL_FILTRO==='todos' || i.tipo===BL_FILTRO);
  const cont = q => todos.filter(i=>quadrante(i)===q).length;
  const card = (i, pos) => `<article class="bl-item">
      ${i.print ? `<a href="${i.print}" target="_blank" rel="noopener" title="Abrir print"><img src="${i.print}" alt="Print da tela ${escHtml(i.tela)}"></a>` : '<div class="sem">sem print</div>'}
      <div>
        <div class="bl-meta"><span class="bl-pos num">${pos}</span><span class="tag q-${quadrante(i)}">${QUAD[quadrante(i)].n}</span>
          ${i.tipo==='bug' ? `<span class="tag ${i.sev}">Bug · ${SEV_ROT[i.sev]}</span>` : '<span class="tag mel">Melhoria</span>'}
          <span class="tag baixa">${i.area}</span>${i.exemplo?'<span>· exemplo</span>':''}</div>
        <p>${escHtml(i.texto)}</p>
        <div class="bl-meta"><span>Valor <b class="num">${i.valor}</b>/5</span><span>· ${ESF_ROT[i.esforco]}</span><span>· tela ${escHtml(i.tela)}</span><span>· ${i.disp}</span><span>· ${i.quando}</span></div>
      </div></article>`;
  return `<div class="backlog">
    <button class="voltar" onclick="S.tela='app';render()">${ico('back')} Voltar ao app</button>
    <h1>Backlog priorizado</h1>
    <div class="sub">Visão da equipe. Tudo o que os alunos reportam chega aqui já classificado e na ordem sugerida: primeiro o que mais atrapalha a jornada e dá menos trabalho.</div>
    <div class="quads">${Object.keys(QUAD).map(q=>`<div class="quad q-${q}"><b>${QUAD[q].n}</b><span>${QUAD[q].d}</span><span class="num">${cont(q)}</span></div>`).join('')}</div>
    <div class="bl-filtro" role="group" aria-label="Filtrar">${[['todos','Tudo'],['bug','Bugs'],['melhoria','Melhorias']].map(([k,n])=>`<button class="chip ${BL_FILTRO===k?'on':''}" onclick="BL_FILTRO='${k}';render(true)">${n}</button>`).join('')}</div>
    <section class="bl-sec">${vis.map((i,k)=>card(i,k+1)).join('') || '<p class="vazio">Nada reportado ainda.</p>'}</section>
  </div>`;
}

/* ------------------------- painel de andamento -------------------------
   Abre com a pergunta que o aluno tem: estou no ritmo? Linha do realizado
   contra o planejado (cinza tracejado = plano), indicadores da semana,
   cobertura por matéria, constância em calendário e o que precisa de atenção.
   Dados fictícios e determinísticos, derivados das matérias da trilha. */
const RAMPA = ['#7fb4f2','#4f94ea','#2a7ae2','#0a60c4','#004a96']; // validada: --ordinal, superfície clara
const SEMANAS_REAL = [0,4,8,11,15,18,22,26];
const SEMANAS_PLANO = [0,3.5,7,10.5,14,17.5,21,24.5];

function coberturaDe(i){ return [43,28,20,20,25,0,15,10,8,5,0,0][i] ?? Math.max(0, 12 - i); }
function acertoDe(i){ return [78,62,70,55,80,null,66,58,null,72][i] ?? null; }

const pct = v => String(v).replace(".", ",") + "%";
function graficoLinha(){
  const W = 900, H = 230, pe = 36, pd = 78, pt = 14, pb = 30, max = 30;
  const x = k => pe + k*(W-pe-pd)/(SEMANAS_REAL.length-1);
  const y = v => pt + (1 - v/max)*(H-pt-pb);
  const caminho = arr => arr.map((v,k)=>`${k?'L':'M'}${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const grade = [0,10,20,30].map(v=>`<line x1="${pe}" x2="${W-pd}" y1="${y(v)}" y2="${y(v)}" class="g-grade"/><text x="${pe-8}" y="${y(v)+4}" class="g-eixo" text-anchor="end">${v}%</text>`).join('');
  const rotX = SEMANAS_REAL.map((_,k)=>`<text x="${x(k)}" y="${H-8}" class="g-eixo" text-anchor="middle">${k===SEMANAS_REAL.length-1?'hoje':'S'+(k+1)}</text>`).join('');
  const ultimo = SEMANAS_REAL.length-1;
  const alvos = SEMANAS_REAL.map((v,k)=>`<rect x="${x(k)-18}" y="${pt}" width="36" height="${H-pt-pb}" class="g-alvo" tabindex="0"
      data-tip="${k===ultimo?'Hoje':'Semana '+(k+1)}: ${pct(v)} do edital coberto · plano ${pct(SEMANAS_PLANO[k])}"></rect>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="grafico" role="img" aria-label="Edital coberto por semana: realizado ${SEMANAS_REAL.join(', ')} por cento; planejado ${SEMANAS_PLANO.join(', ')} por cento">
    ${grade}${rotX}
    <path d="${caminho(SEMANAS_PLANO)}" class="g-plano"/>
    <path d="${caminho(SEMANAS_REAL)}" class="g-real"/>
    ${SEMANAS_REAL.map((v,k)=>`<circle cx="${x(k)}" cy="${y(v)}" r="${k===ultimo?5:3.5}" class="g-ponto"/>`).join('')}
    <text x="${x(ultimo)+10}" y="${y(SEMANAS_REAL[ultimo])-2}" class="g-rot g-rot-real">Você ${SEMANAS_REAL[ultimo]}%</text>
    <text x="${x(ultimo)+10}" y="${y(SEMANAS_PLANO[ultimo])+14}" class="g-rot">Plano ${pct(SEMANAS_PLANO[ultimo])}</text>
    ${alvos}
  </svg>`;
}

function calendario(){
  // 8 semanas × 7 dias, minutos estudados; fim de semana fora do ritmo fica vazio
  const sem = 8, cel = [];
  for(let w=0; w<sem; w++) for(let d=0; d<7; d++){
    const fora = !S.dias[d];
    const hoje = w===sem-1 && d===4, futuro = w===sem-1 && d>4;
    let min = fora || futuro ? 0 : [70,95,40,110,85,60,120,30][(w*3+d)%8];
    if(S.faltou && w===sem-1 && d===3) min = 0;
    if(hoje) min = 35;
    cel.push({w, d, min, fora, futuro});
  }
  const nivel = m => m===0 ? -1 : m<45 ? 0 : m<70 ? 1 : m<95 ? 2 : m<115 ? 3 : 4;
  const dias = ['S','T','Q','Q','S','S','D'];
  return `<div class="cal" role="img" aria-label="Minutos estudados por dia nas últimas 8 semanas">

/* dica de hover/foco compartilhada pelos gráficos do painel */
(function(){
  const tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
  const mostrar = (el, x, y) => { tip.textContent = el.dataset.tip; tip.style.left = Math.min(x+14, innerWidth - tip.offsetWidth - 8)+'px'; tip.style.top = (y+14)+'px'; tip.classList.add('on'); };
  document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el) mostrar(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el){ const b = el.getBoundingClientRect(); mostrar(el, b.left, b.bottom); } });
  document.addEventListener('focusout', () => tip.classList.remove('on'));
})();


/* ------------------------- rascunho por questão -------------------------
   Como a folha de rascunho da prova: texto livre e uma área para desenhar
   (tabela-verdade, diagrama, conta armada). Fica salvo por questão; nas de
   raciocínio lógico já abre sozinho. */
const RE_LOGICA = /l[oó]gic|nega[cç]|equival|probab|contagem|proposi|diagrama|matem|estat/i;
function chaveTopico(topico){ return 't' + Object.keys(QUESTOES_TOPICO).indexOf(topico); }
function rascunhoHTML(key, topico){
  S.rascunhos = S.rascunhos || {}; S.rascAberto = S.rascAberto || {};
  if(S.rascAberto[key] === undefined && RE_LOGICA.test(topico||'')) S.rascAberto[key] = true;
  const r = S.rascunhos[key] || (S.rascunhos[key] = {texto:'', desenho:null, modo:'escrever', ferramenta:'lapis'});
  const salvo = r.texto.trim() || r.desenho;
  const aberto = !!S.rascAberto[key];
  return `<div class="rasc">
    <button class="rasc-btn ${aberto?'on':''}" onclick="S.rascAberto['${key}']=!S.rascAberto['${key}'];render(true)" aria-expanded="${aberto}">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      Rascunho${salvo?' <span class="rasc-salvo">salvo</span>':''}</button>
    ${aberto ? `<div class="rasc-painel">
      <div class="rasc-abas" role="tablist">
        <button role="tab" aria-selected="${r.modo==='escrever'}" class="${r.modo==='escrever'?'on':''}" onclick="S.rascunhos['${key}'].modo='escrever';render(true)">Escrever</button>
        <button role="tab" aria-selected="${r.modo==='desenhar'}" class="${r.modo==='desenhar'?'on':''}" onclick="S.rascunhos['${key}'].modo='desenhar';render(true)">Desenhar</button>
        ${r.modo==='desenhar' ? `<span class="rasc-ferr">
          <button class="${r.ferramenta==='lapis'?'on':''}" onclick="S.rascunhos['${key}'].ferramenta='lapis';render(true)">Lápis</button>
          <button class="${r.ferramenta==='borracha'?'on':''}" onclick="S.rascunhos['${key}'].ferramenta='borracha';render(true)">Borracha</button>
          <button onclick="S.rascunhos['${key}'].desenho=null;render(true)">Limpar</button></span>` : ''}
      </div>
      ${r.modo==='escrever'
        ? `<textarea id="rt_${key}" class="rasc-texto" rows="5" placeholder="Anote o que quiser: contas, a tabela-verdade, as premissas…" oninput="S.rascunhos['${key}'].texto=this.value">${escHtml(r.texto)}</textarea>`
        : `<canvas class="rasc-tela" data-rasc="${key}" width="1200" height="420" aria-label="Área de desenho do rascunho"></canvas>`}
    </div>` : ''}
  </div>`;
}
// Liga o desenho nas telas renderizadas (o HTML é refeito a cada render).
function ativarRascunhos(){
  document.querySelectorAll('canvas[data-rasc]').forEach(cv => {
    const key = cv.dataset.rasc, r = S.rascunhos[key], ctx = cv.getContext('2d');
    if(r.desenho){ const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = r.desenho; }
    let ativo = false, ult = null;
    const pos = e => { const b = cv.getBoundingClientRect(); return [(e.clientX-b.left)*cv.width/b.width, (e.clientY-b.top)*cv.height/b.height]; };
    // Caneta de tablet: o traço segue a pressão, e enquanto a caneta é usada
    // o toque da mão apoiada na tela é ignorado.
    cv.addEventListener('pointerdown', e => {
      if(e.pointerType==='pen') cv._caneta = Date.now();
      if(e.pointerType==='touch' && cv._caneta && Date.now()-cv._caneta < 4000) return;
      ativo = true; ult = pos(e); cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
      if(!ativo) return; const p = pos(e);
      const pressao = e.pointerType==='pen' && e.pressure ? .4 + e.pressure*1.4 : 1;
      if(e.pointerType==='pen') cv._caneta = Date.now();
      ctx.globalCompositeOperation = r.ferramenta==='borracha' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = '#1d1d1f'; ctx.lineWidth = r.ferramenta==='borracha' ? 28 : 3.5*pressao; ctx.lineCap = ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(...ult); ctx.lineTo(...p); ctx.stroke(); ult = p;
    });
    const fim = () => { if(!ativo) return; ativo = false; r.desenho = cv.toDataURL('image/png'); };
    cv.addEventListener('pointerup', fim); cv.addEventListener('pointercancel', fim);
  });
}

async function ativarNotificacao(){

// Evento diário (.ics) com alarme: o calendário do celular toca no horário.
function baixarCalendario(){
  const [h, m] = S.lembrete.hora.split(':');
  const d = new Date(HOJE); const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const dias = ['MO','TU','WE','TH','FR','SA','SU'].filter((_,i)=>S.dias[i]).join(',') || 'MO,TU,WE,TH,FR';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SIPC//Lembrete//PT','BEGIN:VEVENT',
    'UID:sipc-lembrete-'+ymd+'@sipc','DTSTAMP:'+ymd+'T000000Z','DTSTART:'+ymd+'T'+h+m+'00','DURATION:PT'+Math.round(S.horas*60)+'M',
    'RRULE:FREQ=WEEKLY;BYDAY='+dias,'SUMMARY:Estudar no SIPC','DESCRIPTION:Abra o SIPC: revisões do dia (24h\\, 7 e 30 dias) e tópicos novos.',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Hora de estudar no SIPC','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'})); a.download = 'sipc-lembrete.ics'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  S.lembrete.aviso = 'Arquivo sipc-lembrete.ics baixado. Abra no celular e confirme: o evento se repete nos seus dias de estudo, com alarme às ' + S.lembrete.hora + '.';
  render(true);
}

/* ------------------------- minhas trilhas -------------------------
   O aluno pode ter várias trilhas (dois concursos, uma certificação…). Cada
   uma guarda o próprio edital, ritmo, banca e progresso, inclusive onde parou.
   Trocar de trilha salva a atual e carrega a outra. */
const CAMPOS_TRILHA = ['materias','prova','bancas','horas','dias','dataProva','qtdQuestoes','feito','parcial','progTopico','assistidos','rascunhos','arquivos','edModo','edStatus','histRev'];
function fotoTrilha(){ const t = {}; CAMPOS_TRILHA.forEach(k => t[k] = JSON.parse(JSON.stringify(S[k] ?? null))); return t; }
function salvarTrilhaAtual(){
  if(!S.trilhaAtual) return;
  const i = (S.trilhas||[]).findIndex(t=>t.id===S.trilhaAtual);
  if(i>-1) S.trilhas[i] = {...S.trilhas[i], ...fotoTrilha(), vista:{aba:S.aba}};
}
function registrarTrilha(){
  S.trilhas = S.trilhas || [];
  if(!S.trilhaAtual){ S.trilhaAtual = 't'+Date.now(); S.trilhas.push({id:S.trilhaAtual, criada:fmtData(HOJE,{day:'2-digit',month:'2-digit',year:'numeric'})}); }
  salvarTrilhaAtual();
}
function abrirTrilha(id){
  salvarTrilhaAtual();
  const t = S.trilhas.find(x=>x.id===id); if(!t) return;
  CAMPOS_TRILHA.forEach(k => S[k] = JSON.parse(JSON.stringify(t[k])));
  S.trilhaAtual = id; S.tela = 'app'; S.aba = (t.vista && t.vista.aba) || 'hoje'; S.vista = null; S.estudo = null;
  window.scrollTo(0,0); render();
}
function novaTrilha(){
  salvarTrilhaAtual();
  const base = estadoInicial();
  CAMPOS_TRILHA.forEach(k => S[k] = base[k]);
  S.trilhaAtual = null; S.tela = 'assist'; S.passo = 1; S.vista = null; S.estudo = null;
  window.scrollTo(0,0); render();
}
function excluirTrilha(id){
  const t = S.trilhas.find(x=>x.id===id);
  if(!confirm('Excluir a trilha "'+t.prova.nome+'" e todo o progresso dela?')) return;
  S.trilhas = S.trilhas.filter(x=>x.id!==id);
  if(S.trilhaAtual===id){ S.trilhaAtual = null; if(S.trilhas.length) return abrirTrilha(S.trilhas[0].id); return novaTrilha(); }
  render();
}
function resumoTrilha(t){
  const top = t.materias.reduce((a,m)=>a+m.topicos.length,0);
  const feitos = Object.keys(t.feito||{}).length;
  const parcial = Object.values(t.parcial||{})[0];
  const dias = Math.max(0, Math.round((new Date(t.dataProva+'T12:00:00') - HOJE)/86400000));
  return {top, feitos, parcial, dias, pct: Math.min(100, Math.round(feitos/Math.max(1,top)*100))};
}
function telaTrilhas(){
  salvarTrilhaAtual();
  const lista = (S.trilhas||[]).map(t => { const r = resumoTrilha(t), atual = t.id===S.trilhaAtual;
    return `<article class="trilha-card ${atual?'atual':''}">
      <div class="tc-topo"><div><h2>${escHtml(t.prova.nome)}</h2><span class="dim">${(t.bancas||[]).length ? 'Banca '+escHtml(t.bancas.join(' ou ')) : 'Banca a definir'} · ${t.materias.length} matérias · ${r.top} tópicos</span></div>
        ${atual ? '<span class="tag est">Aberta agora</span>' : ''}</div>
      <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.pct}" aria-label="Progresso"><i style="width:${Math.max(r.pct,1)}%"></i></div>
      <div class="tc-dados"><span><b class="num">${r.pct}%</b> concluído</span><span><b class="num">${r.dias}</b> dias até a prova</span><span>Criada em ${t.criada}</span></div>
      ${r.parcial ? `<p class="tc-parou">${ico('info')} <b>${escHtml(r.parcial.topico || 'Questões do dia')}</b> · ${escHtml(r.parcial.rot)}</p>` : ''}
      <div class="fim-estudo" style="margin-top:12px"><button class="btn" onclick="abrirTrilha('${t.id}')">${r.parcial ? 'Continuar de onde parou' : atual ? 'Voltar para esta trilha' : 'Abrir trilha'}</button>
        <button class="btn link ruim-txt" onclick="excluirTrilha('${t.id}')">Excluir</button></div>
    </article>`; }).join('');
  return `<div class="app">
    <div class="topo"><div><h1>Minhas trilhas</h1><div class="sub">Cada trilha é um edital com seu ritmo, banca e progresso. Pode estudar para mais de uma prova ao mesmo tempo.</div></div>
      ${S.trilhaAtual ? `<button class="btn sec" onclick="abrirTrilha('${S.trilhaAtual}')">Voltar à trilha aberta</button>` : ''}</div>
    <div class="trilhas-lista">${lista || '<p class="vazio">Nenhuma trilha ainda.</p>'}
      <button class="trilha-nova" onclick="novaTrilha()"><span>+</span><b>Nova trilha</b><span class="dim">Outro concurso, vestibular ou certificação</span></button>
    </div></div>`;
}

/* ------------------------- modo teste -------------------------
   Para testar e dar feedback sem bagunçar o estudo: com o modo teste ligado,
   tudo acontece normalmente, mas nada vai para a conta. Ao desligar, o
   progresso real volta exatamente como estava e o que foi feito no teste é
   descartado. No app real: nada é gravado no Firestore enquanto ligado. */
function alternarModoTeste(){
  if(!S.modoTeste){
    S._real = {trilhas: JSON.parse(JSON.stringify(S.trilhas||[])), atual: fotoTrilha(), trilhaAtual: S.trilhaAtual, aba: S.aba, tela: S.tela, passo: S.passo};
    S.modoTeste = true;
  } else {
    const r = S._real;
    S.trilhas = r.trilhas; CAMPOS_TRILHA.forEach(k => S[k] = JSON.parse(JSON.stringify(r.atual[k])));
    S.trilhaAtual = r.trilhaAtual; S.aba = r.aba; S.tela = r.tela; S.passo = r.passo; S.vista = null; S.estudo = null;
    S.modoTeste = false; S._real = null;
    avisar('Modo teste desligado. O que você fez no teste foi descartado e seu progresso real voltou.');
  }
  render();
}
function avisar(txt){
  let t = document.getElementById('lembrete');
  if(!t){ t = document.createElement('div'); t.id = 'lembrete'; t.className = 'lembrete'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.innerHTML = '<span>' + escHtml(txt) + '</span>'; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 5000);
}
function chaveTeste(){
  return `<label class="mt-chave ${S.modoTeste?'on':''}"><input type="checkbox" ${S.modoTeste?'checked':''} onchange="alternarModoTeste()"><span class="mt-trilho"></span>Modo teste</label>`;
}

/* ------------------------- revisões montadas pelo aluno -------------------------
   Além do ciclo 1-7-30, o aluno monta revisões quando termina conteúdo: de
   algumas matérias, de uma matéria inteira ou do edital todo (só depois de
   concluir tudo). Cada revisão feita entra no histórico com indicadores. */
// No protótipo, as duas matérias mais adiantadas contam como concluídas.
function materiasConcluidas(){
  return S.materias.map((m,i)=>({m, i, cob:coberturaDe(i)})).sort((a,b)=>b.cob-a.cob).slice(0,2).map(x=>x.m.nome);
}
function poolQuestoes(nomesMaterias){
  const todas = QUESTOES.concat(...Object.values(QUESTOES_TOPICO));
  const daMateria = q => S.materias.find(m => m.topicos.includes(q.topico) || semAcento(m.nome).includes(semAcento(q.topico).split(' ')[0]));
  const unicas = [...new Map(todas.map(q=>[q.enun, q])).values()];
  return unicas.filter(q => { const m = daMateria(q); return m && nomesMaterias.includes(m.nome); });
}
function montarRevisaoHTML(){
  const M = S.montar = S.montar || {escopo:'algumas', sel:[], qtd:10};
  const conc = materiasConcluidas();
  const tudoPronto = conc.length === S.materias.length;
  const opc = [['algumas','Algumas matérias','Escolha as que quer rever'],['materia','Uma matéria inteira','Todos os tópicos de uma matéria'],['edital','O edital todo', tudoPronto ? 'Todas as matérias juntas' : 'Libera quando você concluir todas']];
  const selecao = M.escopo==='edital' ? [] : S.materias.map(m => { const ok = conc.includes(m.nome), on = M.sel.includes(m.nome);
    return `<button class="chip ${on?'on':''}" ${ok?'':'disabled'} aria-pressed="${on}" onclick="escolherMateriaRev('${m.nome.replace(/'/g,"\\'")}')" title="${ok?'Concluída':'Ainda não concluída'}">${escHtml(m.nome)}${ok?'':' · em andamento'}</button>`; }).join('');
  const nomes = M.escopo==='edital' ? S.materias.map(m=>m.nome) : M.sel;
  const pode = M.escopo==='edital' ? tudoPronto : nomes.length>0;
  return `<section class="bloco montar">
    <h3>Montar uma revisão</h3>
    <p class="dim" style="font-size:14px;margin:0 0 12px">Para quando você termina conteúdo e quer testar o que ficou.</p>
    <div class="escolha escolha3">${opc.map(([k,t,d])=>`<button class="opcao ${M.escopo===k?'on':''}" ${k==='edital'&&!tudoPronto?'disabled':''} onclick="S.montar.escopo='${k}';S.montar.sel=[];render(true)"><b>${t}</b><span>${d}</span></button>`).join('')}</div>
    ${M.escopo!=='edital' ? `<span class="f">${M.escopo==='materia'?'Qual matéria':'Quais matérias'} <span class="dim" style="font-weight:400">· só as concluídas</span></span><div class="bancas">${selecao}</div>` : ''}
    <span class="f">Quantas questões</span>${escolhaQtd(M.qtd, 'definirQtdRevisao')}
    <div class="fim-estudo" style="margin-top:14px"><button class="btn" ${pode?'':'disabled'} onclick="comecarRevisaoMontada()">Começar revisão</button></div>
  </section>`;
}
function escolherMateriaRev(n){
  const M = S.montar;
  if(M.escopo==='materia') M.sel = M.sel[0]===n ? [] : [n];
  else M.sel = M.sel.includes(n) ? M.sel.filter(x=>x!==n) : M.sel.concat(n);
  render(true);
}
function definirQtdRevisao(n){ S.montar.qtd = n; render(true); }
function comecarRevisaoMontada(){
  const M = S.montar, nomes = M.escopo==='edital' ? S.materias.map(m=>m.nome) : M.sel;
  const pool = poolQuestoes(nomes);
  const lista = (pool.length ? pool : QUESTOES).slice(0, M.qtd);
  S.itemAtual = null;
  S.quiz = {i:0, sel:null, conf:false, res:[], lista, custom:{nomes, escopo:M.escopo, pedidas:M.qtd}};
  S.vista = 'quiz'; window.scrollTo(0,0); render();
}
function registrarRevisaoMontada(){
  const Q = S.quiz; if(!Q || !Q.custom || Q.registrada) return;
  const porMat = {};
  Q.lista.forEach((q,k)=>{ const m = S.materias.find(mm => mm.topicos.includes(q.topico)) || {nome:q.topico}; const p = porMat[m.nome] = porMat[m.nome] || {ac:0, t:0}; p.t++; if(Q.res[k]) p.ac++; });
  (S.histRev = S.histRev || []).unshift({quando: fmtData(new Date(),{day:'2-digit',month:'2-digit'}), escopo:Q.custom.escopo, nomes:Q.custom.nomes, ac:Q.res.filter(Boolean).length, total:Q.lista.length, porMat});
  Q.registrada = true;
}
function indicadoresRevHTML(){
  const H = S.histRev || [];
  if(!H.length) return `<section class="bloco"><h3>Indicadores das suas revisões</h3><p class="dim" style="font-size:14px;margin:0">Faça a primeira revisão montada para ver aqui o acerto por revisão e por matéria.</p></section>`;
  const tot = H.reduce((a,h)=>a+h.total,0), ac = H.reduce((a,h)=>a+h.ac,0);
  const porMat = {}; H.forEach(h=>Object.entries(h.porMat).forEach(([n,p])=>{ const x = porMat[n] = porMat[n] || {ac:0,t:0}; x.ac+=p.ac; x.t+=p.t; }));
  const mats = Object.entries(porMat).map(([n,p])=>({n, pct:Math.round(p.ac/p.t*100), t:p.t})).sort((a,b)=>a.pct-b.pct);
  const rotEsc = {algumas:'Algumas matérias', materia:'Matéria inteira', edital:'Edital todo'};
  return `<section class="bloco"><h3>Indicadores das suas revisões</h3>
    <div class="kpis kpis3"><div class="kpi"><span class="k-rot">Revisões feitas</span><span class="k-val">${H.length}</span></div>
      <div class="kpi"><span class="k-rot">Acerto geral</span><span class="k-val">${Math.round(ac/tot*100)}%</span><span class="k-delta">${ac} de ${tot} questões</span></div>
      <div class="kpi"><span class="k-rot">Mais fraca</span><span class="k-val" style="font-size:18px">${escHtml(mats[0].n)}</span><span class="k-delta">${mats[0].pct}% de acerto</span></div></div>
    <h4 class="sub-h">Acerto por matéria</h4>
    ${mats.map(x=>`<div class="pm-linha" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)"><span>${escHtml(x.n)} <small class="dim">· ${x.t} questões</small></span><span class="pm-barra"><span class="peso-barra"><i style="width:${Math.max(x.pct,2)}%"></i></span><b>${x.pct}%</b></span></div>`).join('')}
    <h4 class="sub-h">Histórico</h4>
    <ul class="atencao">${H.map(h=>`<li><div><b>${rotEsc[h.escopo]}</b><span class="dim">${h.quando} · ${escHtml(h.nomes.join(', '))}</span></div><span class="num">${h.ac}/${h.total}</span></li>`).join('')}</ul>
  </section>`;
}

/* render(true) mantém a tela sem reanimar a entrada: só a troca de tela anima */
function render(semAnimar){
  const app = document.getElementById('app');
  const foco = document.activeElement && document.activeElement.id;
  const pos = foco && document.activeElement.selectionStart;
  document.body.classList.toggle('teste', !!S.modoTeste);
  app.innerHTML = (S.modoTeste ? `<div class="mt-faixa" role="status"><b>Modo teste ligado</b>: nada do que você fizer agora é salvo na sua conta. <button onclick="alternarModoTeste()">Desligar</button></div>` : '') + (S.tela==='trilhas' ? telaTrilhas() : S.tela==='entrada' ? telaEntrada() : S.tela==='assist' ? telaAssist() : S.tela==='backlog' ? telaBacklog() : telaApp());
  document.body.dataset.tela = S.tela;
  if(semAnimar) app.querySelectorAll('.tela').forEach(el=>el.style.animation='none');
  if(foco){ const el = document.getElementById(foco); if(el){ el.focus(); if(pos!=null && el.setSelectionRange) try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  renderPainel();
  ativarRascunhos();
}
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role=button]')){ e.preventDefault(); e.target.click(); }
});
S = estadoInicial();
render();
</script>
